<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Arkanoid &amp; Pong — Arcade Clássico</title>
  <style>
    /* ==========================================================================
       VARIÁVEIS DE TEMA & RESET ZERO-SCROLL (100dvh)
       ========================================================================== */
    :root {
      --bg-app: #060913;
      --bg-panel: #0d1326;
      --bg-panel-alt: #131c38;
      --border-color: rgba(56, 189, 248, 0.25);
      --text-main: #f1f5f9;
      --text-muted: #94a3b8;
      --accent-primary: #38bdf8;
      --accent-secondary: #f43f5e;
      --accent-gold: #fbbf24;
      --accent-green: #10b981;
      --btn-bg: rgba(30, 41, 59, 0.85);
      --btn-hover: rgba(51, 65, 85, 0.98);
      --shadow-glow: 0 0 20px rgba(56, 189, 248, 0.2);
      --font-ui: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      --font-mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }

    body.theme-retro {
      --bg-app: #050505;
      --bg-panel: #111111;
      --bg-panel-alt: #1a1a1a;
      --border-color: rgba(74, 222, 128, 0.35);
      --text-main: #e2fbe8;
      --text-muted: #86efac;
      --accent-primary: #4ade80;
      --accent-secondary: #facc15;
      --accent-gold: #fde047;
      --accent-green: #22c55e;
      --btn-bg: #17251b;
      --btn-hover: #223828;
      --shadow-glow: 0 0 16px rgba(74, 222, 128, 0.18);
      --font-ui: var(--font-mono);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100dvh;
      overflow: hidden;
      background-color: var(--bg-app);
      color: var(--text-main);
      font-family: var(--font-ui);
      display: flex;
      flex-direction: column;
      transition: background-color 0.25s ease, color 0.25s ease;
    }

    /* ==========================================================================
       CABEÇALHO COMPACTO (TÍTULO ALINHADO À ESQUERDA + 5 BOTÕES VISÍVEIS)
       ========================================================================== */
    header {
      background: var(--bg-panel);
      border-bottom: 1px solid var(--border-color);
      padding: 6px 8px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      flex-shrink: 0;
      z-index: 20;
    }

    .header-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 4px;
      min-height: 30px;
      width: 100%;
      padding-left: 0;
      margin-left: 0;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 5px;
      font-weight: 800;
      font-size: 1.05rem;
      letter-spacing: 0.2px;
      white-space: nowrap;
      color: var(--text-main);
      padding-left: 0;
      margin-left: 0;
      flex-shrink: 1;
      min-width: 0;
    }

    .brand-title-text {
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .brand-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 22px;
      height: 22px;
      border-radius: 6px;
      background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
      color: #fff;
      font-size: 0.78rem;
      flex-shrink: 0;
      box-shadow: var(--shadow-glow);
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 3px;
      flex-shrink: 0;
    }

    .icon-btn {
      background: var(--btn-bg);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      border-radius: 7px;
      height: 28px;
      min-width: 28px;
      padding: 0 6px;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 3px;
      flex-shrink: 0;
      transition: transform 0.1s ease, background-color 0.15s ease, border-color 0.15s ease;
    }

    .icon-btn:hover {
      background: var(--btn-hover);
      border-color: var(--accent-primary);
    }

    .icon-btn:active {
      transform: scale(0.95);
    }

    @media (max-width: 480px) {
      header {
        padding: 5px 6px;
      }
      .brand {
        font-size: 0.9rem;
        gap: 4px;
      }
      .brand-badge {
        width: 20px;
        height: 20px;
        font-size: 0.72rem;
      }
      .header-actions {
        gap: 2px;
      }
      .icon-btn {
        height: 27px;
        min-width: 26px;
        padding: 0 5px;
        font-size: 0.76rem;
      }
      .theme-label {
        display: none;
      }
    }

    .mode-switcher {
      display: flex;
      align-items: center;
      gap: 3px;
      background: var(--bg-app);
      padding: 3px;
      border-radius: 9px;
      border: 1px solid var(--border-color);
      flex: 1;
      max-width: 460px;
    }

    .mode-btn {
      flex: 1;
      border: none;
      background: transparent;
      color: var(--text-muted);
      font-family: inherit;
      font-size: clamp(0.72rem, 2.2vw, 0.82rem);
      font-weight: 700;
      padding: 4px 5px;
      border-radius: 6px;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.15s ease;
    }

    .mode-btn.active {
      background: var(--accent-primary);
      color: #050811;
      box-shadow: 0 2px 8px rgba(56, 189, 248, 0.35);
    }

    body.theme-retro .mode-btn.active {
      color: #031207;
      box-shadow: 0 2px 8px rgba(74, 222, 128, 0.35);
    }

    .ai-select {
      background: var(--btn-bg);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      font-family: inherit;
      font-size: 0.74rem;
      font-weight: 700;
      height: 28px;
      padding: 0 6px;
      border-radius: 7px;
      cursor: pointer;
      outline: none;
      flex-shrink: 0;
    }

    /* ==========================================================================
       BARRA DE TELEMETRIA / PLACAR INTEGRADO
       ========================================================================== */
    .hud-bar {
      display: flex;
      align-items: center;
      justify-content: space-around;
      background: var(--bg-panel-alt);
      border-bottom: 1px solid var(--border-color);
      padding: 4px 8px;
      flex-shrink: 0;
      gap: 6px;
    }

    .hud-item {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: clamp(0.75rem, 2.2vw, 0.88rem);
      font-weight: 700;
    }

    .hud-label {
      color: var(--text-muted);
      font-size: 0.68rem;
      text-transform: uppercase;
      letter-spacing: 0.4px;
    }

    .hud-value {
      font-family: var(--font-mono);
      color: var(--accent-primary);
      font-size: clamp(0.84rem, 2.5vw, 0.98rem);
    }

    .hud-value.gold {
      color: var(--accent-gold);
    }

    .hud-value.danger {
      color: var(--accent-secondary);
    }

    /* ==========================================================================
       ÁREA CENTRAL DO CANVAS & OVERLAYS
       ========================================================================== */
    main {
      flex: 1;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 6px;
      min-height: 0;
      overflow: hidden;
    }

    #arena-wrapper {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 12px;
      border: 2px solid var(--border-color);
      box-shadow: var(--shadow-glow);
      overflow: hidden;
      background: #03050c;
      touch-action: none;
    }

    canvas {
      display: block;
      touch-action: none;
    }

    body.theme-retro #arena-wrapper::after {
      content: "";
      position: absolute;
      inset: 0;
      background: repeating-linear-gradient(
        to bottom,
        rgba(0, 0, 0, 0) 0px,
        rgba(0, 0, 0, 0) 2px,
        rgba(0, 20, 5, 0.25) 3px,
        rgba(0, 20, 5, 0.25) 4px
      );
      pointer-events: none;
      z-index: 5;
    }

    /* ==========================================================================
       OVERLAYS MODAIS (INÍCIO, PAUSA, FASE CONCLUÍDA, FIM DE JOGO)
       ========================================================================== */
    .overlay {
      position: absolute;
      inset: 0;
      background: rgba(4, 7, 17, 0.84);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 16px;
      text-align: center;
      z-index: 15;
      transition: opacity 0.2s ease;
    }

    .overlay.hidden {
      display: none;
    }

    .overlay-card {
      background: var(--bg-panel);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 18px 20px;
      max-width: 340px;
      width: 100%;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.65);
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .overlay-title {
      font-size: 1.32rem;
      font-weight: 800;
      color: var(--accent-primary);
      letter-spacing: 0.4px;
    }

    .overlay-subtitle {
      font-size: 0.84rem;
      color: var(--text-muted);
      line-height: 1.4;
    }

    .overlay-stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      background: var(--bg-app);
      padding: 10px;
      border-radius: 10px;
      border: 1px solid var(--border-color);
    }

    .stat-box {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .stat-box span:first-child {
      font-size: 0.68rem;
      text-transform: uppercase;
      color: var(--text-muted);
    }

    .stat-box span:last-child {
      font-family: var(--font-mono);
      font-size: 1.05rem;
      font-weight: 800;
      color: var(--accent-gold);
    }

    .legend-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 5px;
      text-align: left;
      font-size: 0.74rem;
      background: var(--bg-app);
      padding: 8px 10px;
      border-radius: 10px;
      border: 1px solid var(--border-color);
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 6px;
      color: var(--text-main);
    }

    .pill-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 18px;
      height: 18px;
      border-radius: 4px;
      font-weight: 900;
      font-size: 0.7rem;
      color: #050811;
      flex-shrink: 0;
    }

    .primary-btn {
      background: linear-gradient(135deg, var(--accent-primary), #0284c7);
      color: #040814;
      border: none;
      border-radius: 10px;
      padding: 11px 16px;
      font-family: inherit;
      font-size: 0.95rem;
      font-weight: 800;
      cursor: pointer;
      letter-spacing: 0.4px;
      box-shadow: 0 4px 15px rgba(56, 189, 248, 0.35);
      transition: transform 0.1s ease, filter 0.15s ease;
    }

    body.theme-retro .primary-btn {
      background: linear-gradient(135deg, #4ade80, #16a34a);
      color: #021206;
      box-shadow: 0 4px 15px rgba(74, 222, 128, 0.35);
    }

    .primary-btn:hover {
      filter: brightness(1.08);
    }

    .primary-btn:active {
      transform: scale(0.97);
    }

    /* ==========================================================================
       CONTROLES TÁTEIS INFERIORES (OPCIONAL / RESPONSIVO)
       ========================================================================== */
    footer.touch-dock {
      background: var(--bg-panel);
      border-top: 1px solid var(--border-color);
      padding: 6px 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      flex-shrink: 0;
      z-index: 20;
    }

    footer.touch-dock.hidden {
      display: none;
    }

    .dock-group {
      display: flex;
      align-items: center;
      gap: 6px;
      flex: 1;
    }

    .dock-btn {
      flex: 1;
      height: 40px;
      border-radius: 10px;
      background: var(--btn-bg);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      font-family: inherit;
      font-size: 0.85rem;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      touch-action: manipulation;
    }

    .dock-btn:active, .dock-btn.pressed {
      background: var(--accent-primary);
      color: #040814;
      transform: scale(0.97);
    }

    .dock-btn.action-fire {
      background: rgba(244, 63, 94, 0.2);
      border-color: rgba(244, 63, 94, 0.5);
      color: #fda4af;
      flex: 1.25;
    }

    .dock-btn.action-fire:active, .dock-btn.action-fire.pressed {
      background: var(--accent-secondary);
      color: #fff;
    }
  </style>
</head>
<body>

  <!-- CABEÇALHO EM 2 LINHAS LIMPAS (TÍTULO À ESQUERDA + 5 BOTÕES VISÍVEIS) -->
  <header>
    <div class="header-row">
      <div class="brand">
        <span class="brand-badge">⚡</span>
        <span class="brand-title-text">Arkanoid &amp; Pong</span>
      </div>
      <div class="header-actions">
        <button id="btn-theme" class="icon-btn" title="Alternar Tema Visual" aria-label="Alternar Tema">🌌<span class="theme-label"> Neon</span></button>
        <button id="btn-dock-toggle" class="icon-btn" title="Mostrar/Ocultar Controles Táteis" aria-label="Controles">🎮</button>
        <button id="btn-sound" class="icon-btn" title="Ativar/Desativar Áudio" aria-label="Som">🔊</button>
        <button id="btn-pause" class="icon-btn" title="Pausar (P)" aria-label="Pausar">⏸️</button>
        <button id="btn-restart" class="icon-btn" title="Reiniciar Partida" aria-label="Reiniciar">🔄</button>
      </div>
    </div>

    <div class="header-row">
      <div class="mode-switcher" role="tablist" aria-label="Modo de Jogo">
        <button class="mode-btn active" data-mode="arkanoid" role="tab" aria-selected="true">🧱 Arkanoid</button>
        <button class="mode-btn" data-mode="pong1p" role="tab" aria-selected="false">🏓 Pong 1P</button>
        <button class="mode-btn" data-mode="pong2p" role="tab" aria-selected="false">👥 Pong 2P</button>
      </div>
      <select id="ai-difficulty" class="ai-select" title="Dificuldade da IA" aria-label="Dificuldade da IA" style="display: none;">
        <option value="easy">IA: Fácil</option>
        <option value="medium" selected>IA: Médio</option>
        <option value="hard">IA: Difícil</option>
      </select>
    </div>
  </header>

  <!-- BARRA DE TELEMETRIA / PLACAR -->
  <div class="hud-bar" id="hud-bar"></div>

  <!-- ÁREA CENTRAL MAXIMIZADA -->
  <main id="main-area">
    <div id="arena-wrapper">
      <canvas id="game-canvas"></canvas>

      <!-- OVERLAY DE INÍCIO / PAUSA / VITÓRIA / GAME OVER -->
      <div id="game-overlay" class="overlay">
        <div class="overlay-card">
          <div id="overlay-title" class="overlay-title">🧱 ARKANOID PRO</div>
          <p id="overlay-desc" class="overlay-subtitle">
            Destrua todos os blocos! Arraste na tela, use o mouse ou as setas <b>←/→</b>. Toque ou pressione <b>Espaço</b> para lançar e atirar lasers.
          </p>

          <div id="overlay-legend" class="legend-grid">
            <div class="legend-item"><span class="pill-badge" style="background:#38bdf8;">E</span> Expandir Barra</div>
            <div class="legend-item"><span class="pill-badge" style="background:#a855f7;">M</span> Multiball 3x</div>
            <div class="legend-item"><span class="pill-badge" style="background:#f43f5e;">L</span> Canhão Laser</div>
            <div class="legend-item"><span class="pill-badge" style="background:#f97316;">F</span> Bola de Fogo</div>
            <div class="legend-item"><span class="pill-badge" style="background:#10b981;">+</span> Vida Extra</div>
            <div class="legend-item"><span class="pill-badge" style="background:#fbbf24;">★</span> Combo Rápido</div>
          </div>

          <div id="overlay-stats" class="overlay-stats" style="display: none;">
            <div class="stat-box">
              <span id="stat-label-1">Pontuação</span>
              <span id="stat-val-1">0</span>
            </div>
            <div class="stat-box">
              <span id="stat-label-2">Recorde</span>
              <span id="stat-val-2">0</span>
            </div>
          </div>

          <button id="overlay-btn" class="primary-btn">▶ INICIAR PARTIDA</button>
        </div>
      </div>
    </div>
  </main>

  <!-- BARRA INFERIOR DE CONTROLES TÁTEIS (OPCIONAL) -->
  <footer class="touch-dock" id="touch-dock">
    <div class="dock-group" id="dock-p1-controls">
      <button class="dock-btn" id="btn-left" aria-label="Esquerda">◀ ESQ</button>
      <button class="dock-btn action-fire" id="btn-action" aria-label="Lançar ou Laser">⚡ LANÇAR / LASER</button>
      <button class="dock-btn" id="btn-right" aria-label="Direita">DIR ▶</button>
    </div>
  </footer>

  <script>
    /**
     * ============================================================================
     * ARKANOID & PONG PRO — ENGINE SINGLE-FILE (HTML5 CANVAS + WEB AUDIO API)
     * Padrão Denis-Tek/jogos — Física contínua 60 FPS, High-DPI & Áudio Procedural
     * ============================================================================
     */
    (() => {
      'use strict';

      /* --------------------------------------------------------------------------
         1. SINTETIZADOR DE ÁUDIO PROCEDURAL (WEB AUDIO API)
         -------------------------------------------------------------------------- */
      class SoundEngine {
        constructor() {
          this.ctx = null;
          this.muted = localStorage.getItem('arkanoid_pong_muted') === '1';
        }

        ensureContext() {
          if (this.muted) return null;
          if (!this.ctx) {
            const AudioCtx = window.AudioContext || window.webkitAudioContext;
            if (AudioCtx) this.ctx = new AudioCtx();
          }
          if (this.ctx && this.ctx.state === 'suspended') {
            this.ctx.resume().catch(() => {});
          }
          return this.ctx;
        }

        toggleMute() {
          this.muted = !this.muted;
          localStorage.setItem('arkanoid_pong_muted', this.muted ? '1' : '0');
          return this.muted;
        }

        playTone({ freq = 440, endFreq = null, type = 'sine', duration = 0.09, gain = 0.14, delay = 0 }) {
          const ctx = this.ensureContext();
          if (!ctx) return;

          const now = ctx.currentTime + delay;
          const osc = ctx.createOscillator();
          const amp = ctx.createGain();

          osc.type = type;
          osc.frequency.setValueAtTime(freq, now);
          if (endFreq !== null) {
            osc.frequency.exponentialRampToValueAtTime(Math.max(20, endFreq), now + duration);
          }

          amp.gain.setValueAtTime(0.0001, now);
          amp.gain.linearRampToValueAtTime(gain, now + 0.008);
          amp.gain.exponentialRampToValueAtTime(0.0001, now + duration);

          osc.connect(amp);
          amp.connect(ctx.destination);

          osc.start(now);
          osc.stop(now + duration + 0.015);
        }

        paddleHit(spinFactor = 0) {
          const base = 360 + Math.abs(spinFactor) * 140;
          this.playTone({ freq: base, endFreq: base * 1.35, type: 'triangle', duration: 0.075, gain: 0.16 });
        }

        wallHit() {
          this.playTone({ freq: 240, endFreq: 190, type: 'sine', duration: 0.055, gain: 0.11 });
        }

        brickBreak(combo = 1) {
          const scale = [330, 392, 440, 523.25, 587.33, 659.25, 783.99, 880, 1046.5];
          const note = scale[Math.min(combo - 1, scale.length - 1)];
          this.playTone({ freq: note, endFreq: note * 1.18, type: 'square', duration: 0.09, gain: 0.11 });
        }

        armorHit() {
          this.playTone({ freq: 720, endFreq: 510, type: 'sawtooth', duration: 0.065, gain: 0.12 });
          this.playTone({ freq: 1080, endFreq: 860, type: 'triangle', duration: 0.05, gain: 0.09, delay: 0.02 });
        }

        indestructibleHit() {
          this.playTone({ freq: 150, endFreq: 110, type: 'square', duration: 0.05, gain: 0.1 });
        }

        laserShoot() {
          this.playTone({ freq: 980, endFreq: 260, type: 'sawtooth', duration: 0.11, gain: 0.1 });
        }

        powerUpCollect() {
          const notes = [523.25, 659.25, 783.99, 1046.5];
          notes.forEach((f, i) => {
            this.playTone({ freq: f, type: 'triangle', duration: 0.09, gain: 0.14, delay: i * 0.045 });
          });
        }

        scorePoint(isPlayer = true) {
          if (isPlayer) {
            this.playTone({ freq: 587.33, type: 'triangle', duration: 0.11, gain: 0.16 });
            this.playTone({ freq: 880, type: 'triangle', duration: 0.18, gain: 0.16, delay: 0.09 });
          } else {
            this.playTone({ freq: 311.13, endFreq: 220, type: 'sawtooth', duration: 0.22, gain: 0.13 });
          }
        }

        loseLife() {
          const notes = [392, 349.23, 311.13, 246.94];
          notes.forEach((f, i) => {
            this.playTone({ freq: f, type: 'sawtooth', duration: 0.13, gain: 0.13, delay: i * 0.09 });
          });
        }

        stageClear() {
          const notes = [523.25, 659.25, 783.99, 1046.5, 783.99, 1046.5];
          const times = [0, 0.09, 0.18, 0.27, 0.40, 0.50];
          notes.forEach((f, i) => {
            this.playTone({ freq: f, type: 'triangle', duration: 0.15, gain: 0.16, delay: times[i] });
          });
        }
      }

      const sound = new SoundEngine();

      /* --------------------------------------------------------------------------
         2. CONSTANTES, COORDENADAS VIRTUAIS & FASES DO ARKANOID
         -------------------------------------------------------------------------- */
      const WORLD_W = 450;
      const WORLD_H = 720;

      const POWERUP_TYPES = {
        EXPAND: { code: 'E', label: 'EXPANDIR', color: '#38bdf8' },

      /* --------------------------------------------------------------------------

         -------------------------------------------------------------------------- */
      let renderScale = 1;

      function resizeCanvas() {
        const mainArea = document.getElementById('main-area');
        const availW = Math.max(240, mainArea.clientWidth - 12);
        const availH = Math.max(300, mainArea.clientHeight - 12);

        const targetRatio = WORLD_W / WORLD_H;
        let cssW = availW;
        let cssH = cssW / targetRatio;

        if (cssH > availH) {
          cssH = availH;
          cssW = cssH * targetRatio;
        }

        cssW = Math.floor(cssW);
        cssH = Math.floor(cssH);

        arenaWrapper.style.width = `${cssW}px`;
        arenaWrapper.style.height = `${cssH}px`;

        const dpr = Math.min(window.devicePixelRatio || 1, 2.5);
        canvas.width = Math.round(cssW * dpr);
        canvas.height = Math.round(cssH * dpr);
        canvas.style.width = `${cssW}px`;
        canvas.style.height = `${cssH}px`;

        renderScale = (cssW / WORLD_W) * dpr;
      }

      window.addEventListener('resize', resizeCanvas);
      if (window.ResizeObserver) {
        new ResizeObserver(resizeCanvas).observe(document.getElementById('main-area'));
      }

      /* --------------------------------------------------------------------------
         6. INICIALIZAÇÃO DE MODOS E ENTIDADES
         -------------------------------------------------------------------------- */
      function createBall({ x, y, vx = 0, vy = 0, radius = 7.5, stuck = false, fire = false }) {
        return {
          x,
          y,
          vx,
          vy,
          radius,
          stuck,
          fire,
          spin: 0,
          trail: []
        };
      }

      function spawnFloatingText(x, y, text, color = '#fbbf24') {
        state.floatingTexts.push({
          x,
          y,
          text,
          color,
          life: 0.85,
          maxLife: 0.85
        });
      }

      function spawnParticles(x, y, color, count = 10, speedScale = 1) {
        for (let i = 0; i < count; i++) {
          const angle = (Math.PI * 2 * i) / count + (Math.random() - 0.5) * 0.5;
          const speed = (65 + Math.random() * 165) * speedScale;
          state.particles.push({
            x,
            y,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed,
            size: 2.2 + Math.random() * 2.8,
            color,
            life: 0.35 + Math.random() * 0.25,
            maxLife: 0.6
          });
        }
      }

      function triggerShake(intensity = 4, duration = 0.12) {
        state.shakeIntensity = Math.max(state.shakeIntensity, intensity);
        state.shakeTime = Math.max(state.shakeTime, duration);
      }

      function buildArkanoidStage(stageNum) {
        const template = ARKANOID_STAGES[(stageNum - 1) % ARKANOID_STAGES.length];
        const loopCycle = Math.floor((stageNum - 1) / ARKANOID_STAGES.length);
        const grid = template.grid;

        const cols = 8;
        const marginX = 22;
        const gap = 6;
        const brickW = (WORLD_W - marginX * 2 - gap * (cols - 1)) / cols;
        const brickH = 22;
        const startY = 76;

        state.bricks = [];
        for (let r = 0; r < grid.length; r++) {
          for (let c = 0; c < cols; c++) {
            let type = grid[r][c];
            if (type === 0) continue;

            if (loopCycle > 0 && type === 1 && (r + loopCycle) % 3 === 0) {
              type = 2;
            }

            let hp = 1;
            let maxHp = 1;
            let points = (grid.length - r) * 15 + 20;
            let color = ROW_PALETTE_NEON[r % ROW_PALETTE_NEON.length];

            if (type === 2) {
              hp = 2;
              maxHp = 2;
              points = 120;
              color = '#cbd5e1';
            } else if (type === 3) {
              hp = 3;
              maxHp = 3;
              points = 220;
              color = '#fbbf24';
            } else if (type === 9) {
              hp = Infinity;
              maxHp = Infinity;
              points = 0;
              color = '#475569';
            }

            state.bricks.push({
              x: marginX + c * (brickW + gap),
              y: startY + r * (brickH + gap),
              w: brickW,
              h: brickH,
              type,
              hp,
              maxHp,
              points,
              color,
              flash: 0
            });
          }
        }
      }

      /* --------------------------------------------------------------------------
         7. AÇÕES DO JOGADOR (LANÇAR BOLA, DISPARAR LASER)
         -------------------------------------------------------------------------- */
      function triggerPrimaryAction() {
        sound.ensureContext();
        if (state.status !== 'playing') return;

        if (state.mode === 'arkanoid') {
          let launched = false;
          state.balls.forEach((b) => {
            if (b.stuck) {
              b.stuck = false;
              const speed = 370 + Math.min(state.stage * 14, 110);
              const angle = -Math.PI / 2 + (Math.random() * 0.4 - 0.2);
              b.vx = Math.cos(angle) * speed;
              b.vy = Math.sin(angle) * speed;
              launched = true;
            }
          });
          if (launched) {
            sound.paddleHit(0.2);
            return;
          }

          if (state.p1.laserTimer > 0 && state.p1.laserCooldown <= 0) {
            const offset = state.p1.w * 0.36;
            state.lasers.push(
              { x: state.p1.x - offset, y: state.p1.y - state.p1.h / 2 - 6, vy: -680 },
              { x: state.p1.x + offset, y: state.p1.y - state.p1.h / 2 - 6, vy: -680 }
            );
            state.p1.laserCooldown = 0.28;
            sound.laserShoot();
          }
        }
      }

      /* --------------------------------------------------------------------------
         8. LÓGICA DE POWER-UPS & COLISÕES (ARKANOID)
         -------------------------------------------------------------------------- */
      function maybeSpawnPowerUp(x, y) {
        if (Math.random() > 0.24) return;
        const pool = ['EXPAND', 'EXPAND', 'MULTI', 'MULTI', 'LASER', 'LASER', 'FIRE', 'LIFE'];
        const chosenKey = pool[Math.floor(Math.random() * pool.length)];
        const info = POWERUP_TYPES[chosenKey];

        state.powerups.push({
          x,
          y,
          w: 28,
          h: 16,
          vy: 145,
          type: chosenKey,
          code: info.code,
          label: info.label,
          color: info.color
        });
      }

      function applyPowerUp(pu) {
        sound.powerUpCollect();
        spawnParticles(pu.x, pu.y, pu.color, 14, 1.1);
        spawnFloatingText(pu.x, pu.y - 12, pu.label, pu.color);
        addArkanoidScore(50);

        if (pu.type === 'EXPAND') {
          state.p1.w = Math.min(148, state.p1.baseW * 1.55);
          state.p1.expandTimer = 16;
        } else if (pu.type === 'MULTI') {
          const sourceBalls = state.balls.filter((b) => !b.stuck);
          const ref = sourceBalls[0] || state.balls[0];
          if (ref && state.balls.length < 9) {
            const speed = Math.hypot(ref.vx, ref.vy) || 380;
            const angles = [-0.45, 0.45];
            angles.forEach((delta) => {
              const baseAngle = Math.atan2(ref.vy, ref.vx) + delta;
              state.balls.push(
                createBall({
                  x: ref.x,
                  y: ref.y,
                  vx: Math.cos(baseAngle) * speed,
                  vy: Math.sin(baseAngle) * speed,
                  radius: ref.radius,
                  fire: ref.fire,
                  stuck: false
                })
              );
            });
          }
        } else if (pu.type === 'LASER') {
          state.p1.laserTimer = 14;
        } else if (pu.type === 'FIRE') {
          state.balls.forEach((b) => {
            b.fire = true;
          });
        } else if (pu.type === 'LIFE') {
          state.lives = Math.min(6, state.lives + 1);
          updateHUD();
        }
      }

      function addArkanoidScore(pts) {
        state.score += pts;
        if (state.score > state.highScore) {
          state.highScore = state.score;
          localStorage.setItem('arkanoid_pong_highscore', String(state.highScore));
        }
        updateHUD();
      }

      function damageBrick(brick, isFireBall = false) {
        if (brick.type === 9) {
          sound.indestructibleHit();
          brick.flash = 0.14;
          return false;
        }

        brick.hp -= isFireBall ? 3 : 1;
        brick.flash = 0.16;

        if (brick.hp <= 0) {
          state.combo++;
          state.comboTimer = 2.0;
          const mult = Math.min(4, 1 + Math.floor((state.combo - 1) / 3));
          const gained = brick.points * mult;
          addArkanoidScore(gained);

          sound.brickBreak(state.combo);
          spawnParticles(brick.x + brick.w / 2, brick.y + brick.h / 2, brick.color, 12, 1);

          if (mult > 1) {
            spawnFloatingText(brick.x + brick.w / 2, brick.y, `+${gained} (${mult}x)`, '#fbbf24');
          }

          maybeSpawnPowerUp(brick.x + brick.w / 2, brick.y + brick.h / 2);
          return true;
        } else {
          sound.armorHit();
          spawnParticles(brick.x + brick.w / 2, brick.y + brick.h / 2, '#ffffff', 5, 0.6);
          return false;
        }
      }

      /* --------------------------------------------------------------------------
         9. ATUALIZAÇÃO DE FÍSICA (60 FPS DELTA TIME)
         -------------------------------------------------------------------------- */
      function updatePaddles(dt) {
        const prevX1 = state.p1.x;
        let dir1 = 0;
        if (state.keys.left) dir1 -= 1;
        if (state.keys.right) dir1 += 1;

        if (dir1 !== 0) {
          state.p1.x += dir1 * state.p1.speed * dt;
        }

        const halfW1 = state.p1.w / 2;
        state.p1.x = Math.max(halfW1 + 6, Math.min(WORLD_W - halfW1 - 6, state.p1.x));
        state.p1.vx = (state.p1.x - prevX1) / Math.max(dt, 0.001);

        if (state.mode === 'arkanoid') {
          if (state.p1.expandTimer > 0) {
            state.p1.expandTimer -= dt;
            if (state.p1.expandTimer <= 0) {
              state.p1.w = state.p1.baseW;
            }
          }
          if (state.p1.laserTimer > 0) {
            state.p1.laserTimer -= dt;
          }
          if (state.p1.laserCooldown > 0) {
            state.p1.laserCooldown -= dt;
          }
        }

        if (state.mode === 'pong2p') {
          const prevX2 = state.p2.x;
          let dir2 = 0;
          if (state.keys.p2Left) dir2 -= 1;
          if (state.keys.p2Right) dir2 += 1;
          if (dir2 !== 0) {
            state.p2.x += dir2 * state.p2.speed * dt;
          }
          const halfW2 = state.p2.w / 2;
          state.p2.x = Math.max(halfW2 + 6, Math.min(WORLD_W - halfW2 - 6, state.p2.x));
          state.p2.vx = (state.p2.x - prevX2) / Math.max(dt, 0.001);
        } else if (state.mode === 'pong1p') {
          updatePongAI(dt);
        }
      }

      function updatePongAI(dt) {
        const diff = aiSelect.value;
        const speedMap = { easy: 255, medium: 365, hard: 495 };
        const errorMap = { easy: 34, medium: 17, hard: 5 };
        const reactMap = { easy: 0.24, medium: 0.12, hard: 0.04 };

        const prevX2 = state.p2.x;
        state.p2.aiReactionTimer -= dt;

        const ball = state.balls[0];
        if (ball && state.p2.aiReactionTimer <= 0) {
          state.p2.aiReactionTimer = reactMap[diff];
          if (ball.vy < 0) {
            const timeToReach = Math.max(0, (ball.y - state.p2.y) / Math.abs(ball.vy));
            let predictedX = ball.x + ball.vx * timeToReach;
            while (predictedX < 0 || predictedX > WORLD_W) {
              if (predictedX < 0) predictedX = -predictedX;
              if (predictedX > WORLD_W) predictedX = 2 * WORLD_W - predictedX;
            }
            state.p2.aiErrorOffset = (Math.random() * 2 - 1) * errorMap[diff];
            state.p2.aiTargetX = predictedX + state.p2.aiErrorOffset;
          } else {
            state.p2.aiTargetX = WORLD_W / 2 + (Math.random() * 30 - 15);
          }
        }

        const delta = state.p2.aiTargetX - state.p2.x;
        const maxStep = speedMap[diff] * dt;
        if (Math.abs(delta) > 3) {
          state.p2.x += Math.sign(delta) * Math.min(Math.abs(delta), maxStep);
        }

        const halfW2 = state.p2.w / 2;
        state.p2.x = Math.max(halfW2 + 6, Math.min(WORLD_W - halfW2 - 6, state.p2.x));
        state.p2.vx = (state.p2.x - prevX2) / Math.max(dt, 0.001);
      }

      function reflectBallFromPaddle(ball, paddle, isTopPaddle) {
        const hitOffset = (ball.x - paddle.x) / (paddle.w / 2);
        const clampedOffset = Math.max(-1, Math.min(1, hitOffset));
        const maxBounceAngle = (62 * Math.PI) / 180;
        const bounceAngle = clampedOffset * maxBounceAngle;

        let speed = Math.hypot(ball.vx, ball.vy);
        const maxSpeed = state.mode === 'arkanoid' ? 620 : 720;
        speed = Math.min(maxSpeed, speed * 1.028 + 4);

        const spinImpulse = Math.max(-1, Math.min(1, paddle.vx / 600));
        ball.spin = spinImpulse * 0.85;

        ball.vx = Math.sin(bounceAngle) * speed + spinImpulse * 55;
        ball.vy = (isTopPaddle ? 1 : -1) * Math.cos(bounceAngle) * speed;

        if (Math.abs(ball.vy) < speed * 0.32) {
          ball.vy = (isTopPaddle ? 1 : -1) * speed * 0.32;
        }

        ball.y = isTopPaddle
          ? paddle.y + paddle.h / 2 + ball.radius + 1
          : paddle.y - paddle.h / 2 - ball.radius - 1;

        sound.paddleHit(spinImpulse);
        spawnParticles(ball.x, ball.y, isTopPaddle ? '#f43f5e' : '#38bdf8', 7, 0.7);
      }

      function updateBalls(dt) {
        if (state.mode !== 'arkanoid' && state.pongServeTimer > 0) {
          state.pongServeTimer -= dt;
          if (state.pongServeTimer <= 0) {
            servePongBall(state.pongServeDir);
          }
          return;
        }

        for (let i = state.balls.length - 1; i >= 0; i--) {
          const b = state.balls[i];

          if (b.stuck) {
            b.x = state.p1.x;
            b.y = state.p1.y - state.p1.h / 2 - b.radius - 1;
            continue;
          }

          b.trail.push({ x: b.x, y: b.y });
          if (b.trail.length > 9) b.trail.shift();

          if (Math.abs(b.spin) > 0.02) {
            b.vx += b.spin * 110 * dt;
            b.spin *= Math.pow(0.65, dt);
          }

          b.x += b.vx * dt;
          b.y += b.vy * dt;

          if (b.x - b.radius <= 4) {
            b.x = 4 + b.radius;
            b.vx = Math.abs(b.vx);
            sound.wallHit();
          } else if (b.x + b.radius >= WORLD_W - 4) {
            b.x = WORLD_W - 4 - b.radius;
            b.vx = -Math.abs(b.vx);
            sound.wallHit();
          }

          if (state.mode === 'arkanoid' && b.y - b.radius <= 4) {
            b.y = 4 + b.radius;
            b.vy = Math.abs(b.vy);
            if (Math.abs(b.vy) < 95) b.vy = 95;
            sound.wallHit();
          }

          const p1Top = state.p1.y - state.p1.h / 2;
          const p1Bot = state.p1.y + state.p1.h / 2;
          if (
            b.vy > 0 &&
            b.y + b.radius >= p1Top &&
            b.y - b.radius <= p1Bot &&
            b.x + b.radius >= state.p1.x - state.p1.w / 2 &&
            b.x - b.radius <= state.p1.x + state.p1.w / 2
          ) {
            reflectBallFromPaddle(b, state.p1, false);
          }

          if (state.mode !== 'arkanoid') {
            const p2Top = state.p2.y - state.p2.h / 2;
            const p2Bot = state.p2.y + state.p2.h / 2;
            if (
              b.vy < 0 &&
              b.y - b.radius <= p2Bot &&
              b.y + b.radius >= p2Top &&
              b.x + b.radius >= state.p2.x - state.p2.w / 2 &&
              b.x - b.radius <= state.p2.x + state.p2.w / 2
            ) {
              reflectBallFromPaddle(b, state.p2, true);
            }
          }

          if (state.mode === 'arkanoid') {
            for (let j = state.bricks.length - 1; j >= 0; j--) {
              const br = state.bricks[j];
              const closestX = Math.max(br.x, Math.min(b.x, br.x + br.w));
              const closestY = Math.max(br.y, Math.min(b.y, br.y + br.h));
              const dx = b.x - closestX;
              const dy = b.y - closestY;

              if (dx * dx + dy * dy <= b.radius * b.radius) {
                const destroyed = damageBrick(br, b.fire);
                if (destroyed) {
                  state.bricks.splice(j, 1);
                  triggerShake(3, 0.08);
                }

                if (!(b.fire && br.type !== 9)) {
                  const overlapLeft = (b.x + b.radius) - br.x;
                  const overlapRight = (br.x + br.w) - (b.x - b.radius);
                  const overlapTop = (b.y + b.radius) - br.y;
                  const overlapBottom = (br.y + br.h) - (b.y - b.radius);
                  const minOverlapX = Math.min(overlapLeft, overlapRight);
                  const minOverlapY = Math.min(overlapTop, overlapBottom);

                  if (minOverlapX < minOverlapY) {
                    b.vx = -b.vx;
                    b.x += overlapLeft < overlapRight ? -minOverlapX : minOverlapX;
                  } else {
                    b.vy = -b.vy;
                    b.y += overlapTop < overlapBottom ? -minOverlapY : minOverlapY;
                  }
                }
                break;
              }
            }
          }

          if (state.mode === 'arkanoid') {
            if (b.y - b.radius > WORLD_H + 10) {
              state.balls.splice(i, 1);
            }
          } else {
            if (b.y - b.radius > WORLD_H + 10) {
              state.pongScore2++;
              updateHUD();
              sound.scorePoint(false);
              triggerShake(6, 0.18);
              spawnParticles(b.x, WORLD_H - 12, '#f43f5e', 18, 1.2);
              checkPongRoundEnd(1);
              return;
            } else if (b.y + b.radius < -10) {
              state.pongScore1++;
              updateHUD();
              sound.scorePoint(true);
              triggerShake(6, 0.18);
              spawnParticles(b.x, 12, '#38bdf8', 18, 1.2);
              checkPongRoundEnd(-1);
              return;
            }
          }
        }

        if (state.mode === 'arkanoid') {
          if (state.balls.length === 0) {
            state.lives--;
            updateHUD();
            triggerShake(7, 0.22);
            if (state.lives <= 0) {
              sound.loseLife();
              state.status = 'gameover';
              showOverlay({
                title: '💥 FIM DE JOGO',
                desc: 'Todas as esferas foram perdidas. Tente novamente para superar seu recorde!',
                stats: {
                  label1: 'Pontuação Final',
                  val1: state.score,
                  label2: 'Melhor Recorde',
                  val2: state.highScore
                },
                btnText: '↻ JOGAR NOVAMENTE',
                action: 'restart'
              });
            } else {
              sound.loseLife();
              resetPaddleAndBallArkanoid();
            }
            return;
          }

          const remainingBreakable = state.bricks.some((br) => br.type !== 9);
          if (!remainingBreakable) {
            sound.stageClear();
            const stageBonus = state.stage * 250;
            addArkanoidScore(stageBonus);
            state.status = 'stage_clear';
            showOverlay({
              title: `🏆 FASE ${state.stage} CONCLUÍDA!`,
              desc: `Bônus de fase: <b>+${stageBonus} pts</b>. Prepare-se para a próxima muralha!`,
              stats: {
                label1: 'Pontuação',
                val1: state.score,
                label2: 'Recorde',
                val2: state.highScore
              },
              btnText: `▶ FASE ${state.stage + 1}`,
              action: 'next_stage'
            });
          }
        }
      }

      function checkPongRoundEnd(nextServeDir) {
        state.balls = [];
        if (state.pongScore1 >= state.pongTargetScore || state.pongScore2 >= state.pongTargetScore) {
          const p1Won = state.pongScore1 >= state.pongTargetScore;
          if (p1Won) {
            state.pongWins++;
            localStorage.setItem('arkanoid_pong_wins', String(state.pongWins));
            sound.stageClear();
          } else {
            sound.loseLife();
          }
          updateHUD();

          const winnerTitle =
            state.mode === 'pong1p'
              ? (p1Won ? '🏆 VITÓRIA DA PARTIDA!' : '🤖 A IA VENCEU!')
              : (p1Won ? '🏆 JOGADOR 1 (BASE) VENCEU!' : '🏆 JOGADOR 2 (TOPO) VENCEU!');

          state.status = 'gameover';
          showOverlay({
            title: winnerTitle,
            desc: 'Partida encerrada! Clique abaixo para iniciar uma revanche imediata.',
            stats: {
              label1: 'Placar Final',
              val1: `${state.pongScore1} × ${state.pongScore2}`,
              label2: 'Total Vitórias',
              val2: state.pongWins
            },
            btnText: '↻ REVANCHE',
            action: 'restart'
          });
        } else {
          state.pongServeDir = nextServeDir;
          state.pongServeTimer = 0.7;
        }
      }

      function updateLasersAndPowerUps(dt) {
        for (let i = state.lasers.length - 1; i >= 0; i--) {
          const l = state.lasers[i];
          l.y += l.vy * dt;
          if (l.y < -15) {
            state.lasers.splice(i, 1);
            continue;
          }

          let hit = false;
          for (let j = state.bricks.length - 1; j >= 0; j--) {
            const br = state.bricks[j];
            if (l.x >= br.x && l.x <= br.x + br.w && l.y <= br.y + br.h && l.y >= br.y) {
              const destroyed = damageBrick(br, false);
              if (destroyed) state.bricks.splice(j, 1);
              hit = true;
              break;
            }
          }
          if (hit) {
            state.lasers.splice(i, 1);
          }
        }

        for (let i = state.powerups.length - 1; i >= 0; i--) {
          const pu = state.powerups[i];
          pu.y += pu.vy * dt;

          if (
            pu.y + pu.h / 2 >= state.p1.y - state.p1.h / 2 &&
            pu.y - pu.h / 2 <= state.p1.y + state.p1.h / 2 &&
            pu.x + pu.w / 2 >= state.p1.x - state.p1.w / 2 &&
            pu.x - pu.w / 2 <= state.p1.x + state.p1.w / 2
          ) {
            applyPowerUp(pu);
            state.powerups.splice(i, 1);
            continue;
          }

          if (pu.y - pu.h > WORLD_H + 10) {
            state.powerups.splice(i, 1);
          }
        }
      }

      function updateEffects(dt) {
        if (state.comboTimer > 0) {
          state.comboTimer -= dt;
          if (state.comboTimer <= 0) state.combo = 0;
        }

        if (state.shakeTime > 0) {
          state.shakeTime -= dt;
          if (state.shakeTime <= 0) state.shakeIntensity = 0;
        }

        for (let i = state.bricks.length - 1; i >= 0; i--) {
          if (state.bricks[i].flash > 0) {
            state.bricks[i].flash = Math.max(0, state.bricks[i].flash - dt);
          }
        }

        for (let i = state.particles.length - 1; i >= 0; i--) {
          const p = state.particles[i];
          p.x += p.vx * dt;
          p.y += p.vy * dt;
          p.vx *= 0.96;
          p.vy *= 0.96;
          p.life -= dt;
          if (p.life <= 0) state.particles.splice(i, 1);
        }

        for (let i = state.floatingTexts.length - 1; i >= 0; i--) {
          const ft = state.floatingTexts[i];
          ft.y -= 34 * dt;
          ft.life -= dt;
          if (ft.life <= 0) state.floatingTexts.splice(i, 1);
        }
      }

      /* --------------------------------------------------------------------------
         10. RENDERIZAÇÃO CANVAS 2D HIGH-DPI (NEON ARCADE & RETRÔ CLÁSSICO)
         -------------------------------------------------------------------------- */
      function drawRoundedRect(x, y, w, h, r) {
        const radius = Math.min(r, w / 2, h / 2);
        ctx.beginPath();
        ctx.moveTo(x + radius, y);
        ctx.arcTo(x + w, y, x + w, y + h, radius);
        ctx.arcTo(x + w, y + h, x, y + h, radius);
        ctx.arcTo(x, y + h, x, y, radius);
        ctx.arcTo(x, y, x + w, y, radius);
        ctx.closePath();
      }

      function render() {
        const isRetro = state.theme === 'retro';

        ctx.save();
        ctx.scale(renderScale, renderScale);

        if (state.shakeTime > 0) {
          const sx = (Math.random() * 2 - 1) * state.shakeIntensity;
          const sy = (Math.random() * 2 - 1) * state.shakeIntensity;
          ctx.translate(sx, sy);
        }

        ctx.fillStyle = isRetro ? '#030804' : '#050814';
        ctx.fillRect(0, 0, WORLD_W, WORLD_H);

        ctx.strokeStyle = isRetro ? 'rgba(74, 222, 128, 0.06)' : 'rgba(56, 189, 248, 0.05)';
        ctx.lineWidth = 1;
        const step = 30;
        for (let gx = step; gx < WORLD_W; gx += step) {
          ctx.beginPath();
          ctx.moveTo(gx, 0);
          ctx.lineTo(gx, WORLD_H);
          ctx.stroke();
        }
        for (let gy = step; gy < WORLD_H; gy += step) {
          ctx.beginPath();
          ctx.moveTo(0, gy);
          ctx.lineTo(WORLD_W, gy);
          ctx.stroke();
        }

        if (state.mode !== 'arkanoid') {
          ctx.save();
          ctx.setLineDash([10, 10]);
          ctx.strokeStyle = isRetro ? 'rgba(74, 222, 128, 0.35)' : 'rgba(148, 163, 184, 0.25)';
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.moveTo(12, WORLD_H / 2);
          ctx.lineTo(WORLD_W - 12, WORLD_H / 2);
          ctx.stroke();

          ctx.setLineDash([]);
          ctx.beginPath();
          ctx.arc(WORLD_W / 2, WORLD_H / 2, 46, 0, Math.PI * 2);
          ctx.stroke();
          ctx.restore();

          ctx.save();
          ctx.font = '800 56px ui-monospace, monospace';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillStyle = isRetro ? 'rgba(74, 222, 128, 0.12)' : 'rgba(56, 189, 248, 0.1)';
          ctx.fillText(`${state.pongScore2}`, WORLD_W / 2, WORLD_H / 2 - 74);
          ctx.fillText(`${state.pongScore1}`, WORLD_W / 2, WORLD_H / 2 + 78);
          ctx.restore();
        }

        if (state.mode === 'arkanoid') {
          state.bricks.forEach((br) => {
            const fillColor = isRetro
              ? (br.type === 9 ? '#1e3a29' : br.type === 3 ? '#fde047' : br.type === 2 ? '#86efac' : '#4ade80')
              : br.color;

            ctx.save();
            if (!isRetro) {
              ctx.shadowColor = fillColor;
              ctx.shadowBlur = br.flash > 0 ? 14 : 6;
            }

            ctx.fillStyle = br.flash > 0 ? '#ffffff' : fillColor;
            drawRoundedRect(br.x, br.y, br.w, br.h, isRetro ? 2 : 5);
            ctx.fill();

            ctx.fillStyle = 'rgba(255, 255, 255, 0.22)';
            ctx.fillRect(br.x + 2, br.y + 2, br.w - 4, 4);

            if (br.type !== 9 && br.hp < br.maxHp) {
              ctx.strokeStyle = '#0f172a';
              ctx.lineWidth = 1.8;
              ctx.beginPath();
              ctx.moveTo(br.x + br.w * 0.25, br.y + 2);
              ctx.lineTo(br.x + br.w * 0.45, br.y + br.h * 0.55);
              ctx.lineTo(br.x + br.w * 0.35, br.y + br.h - 2);
              if (br.maxHp - br.hp >= 2) {
                ctx.moveTo(br.x + br.w * 0.72, br.y + 3);
                ctx.lineTo(br.x + br.w * 0.58, br.y + br.h * 0.6);
                ctx.lineTo(br.x + br.w * 0.78, br.y + br.h - 2);
              }
              ctx.stroke();
            }

            if (br.type === 9) {
              ctx.fillStyle = 'rgba(255, 255, 255, 0.35)';
              ctx.fillRect(br.x + 4, br.y + 4, 3, 3);
              ctx.fillRect(br.x + br.w - 7, br.y + 4, 3, 3);
              ctx.fillRect(br.x + 4, br.y + br.h - 7, 3, 3);
              ctx.fillRect(br.x + br.w - 7, br.y + br.h - 7, 3, 3);
            }

            ctx.restore();
          });
        }

        state.powerups.forEach((pu) => {
          ctx.save();
          const c = isRetro ? '#4ade80' : pu.color;
          if (!isRetro) {
            ctx.shadowColor = c;
            ctx.shadowBlur = 10;
          }
          ctx.fillStyle = c;
          drawRoundedRect(pu.x - pu.w / 2, pu.y - pu.h / 2, pu.w, pu.h, 8);
          ctx.fill();

          ctx.fillStyle = '#040814';
          ctx.font = '900 11px ui-monospace, monospace';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillText(pu.code, pu.x, pu.y + 0.5);
          ctx.restore();
        });

        state.lasers.forEach((l) => {
          ctx.save();
          ctx.fillStyle = isRetro ? '#fde047' : '#f43f5e';
          if (!isRetro) {
            ctx.shadowColor = '#f43f5e';
            ctx.shadowBlur = 10;
          }
          ctx.fillRect(l.x - 2, l.y - 8, 4, 14);
          ctx.restore();
        });

        drawPaddle(state.p1, isRetro ? '#4ade80' : '#38bdf8', state.p1.laserTimer > 0);
        if (state.mode !== 'arkanoid') {
          drawPaddle(state.p2, isRetro ? '#fde047' : '#f43f5e', false);
        }

        state.balls.forEach((b) => {
          const ballColor = b.fire
            ? '#f97316'
            : isRetro
              ? '#e2fbe8'
              : '#ffffff';

          b.trail.forEach((pt, idx) => {
            const ratio = (idx + 1) / b.trail.length;
            ctx.save();
            ctx.globalAlpha = ratio * 0.35;
            ctx.fillStyle = b.fire ? '#fb923c' : (isRetro ? '#4ade80' : '#38bdf8');
            ctx.beginPath();
            ctx.arc(pt.x, pt.y, b.radius * ratio * 0.85, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();
          });

          ctx.save();
          if (!isRetro) {
            ctx.shadowColor = b.fire ? '#f97316' : '#38bdf8';
            ctx.shadowBlur = b.fire ? 16 : 10;
          }
          ctx.fillStyle = ballColor;
          ctx.beginPath();
          ctx.arc(b.x, b.y, b.radius, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
        });

        state.particles.forEach((p) => {
          ctx.save();
          ctx.globalAlpha = Math.max(0, p.life / p.maxLife);
          ctx.fillStyle = isRetro ? '#4ade80' : p.color;
          ctx.fillRect(p.x - p.size / 2, p.y - p.size / 2, p.size, p.size);
          ctx.restore();
        });

        state.floatingTexts.forEach((ft) => {
          ctx.save();
          ctx.globalAlpha = Math.max(0, ft.life / ft.maxLife);
          ctx.font = '800 13px system-ui, sans-serif';
          ctx.textAlign = 'center';
          ctx.fillStyle = isRetro ? '#fde047' : ft.color;
          ctx.fillText(ft.text, ft.x, ft.y);
          ctx.restore();
        });

        if (state.status === 'playing' && state.mode === 'arkanoid' && state.balls.some((b) => b.stuck)) {
          ctx.save();
          ctx.font = '700 12px system-ui, sans-serif';
          ctx.textAlign = 'center';
          ctx.fillStyle = isRetro ? 'rgba(134, 239, 172, 0.8)' : 'rgba(148, 163, 184, 0.85)';
          ctx.fillText('TOQUE OU PRESSIONE ESPAÇO PARA LANÇAR', WORLD_W / 2, WORLD_H / 2 + 55);
          ctx.restore();
        }

        ctx.restore();
      }

      function drawPaddle(paddle, color, hasLasers) {
        const isRetro = state.theme === 'retro';
        const left = paddle.x - paddle.w / 2;
        const top = paddle.y - paddle.h / 2;

        ctx.save();
        if (!isRetro) {
          ctx.shadowColor = color;
          ctx.shadowBlur = 12;
        }
        ctx.fillStyle = color;
        drawRoundedRect(left, top, paddle.w, paddle.h, isRetro ? 2 : 7);
        ctx.fill();

        ctx.fillStyle = 'rgba(255, 255, 255, 0.45)';
        drawRoundedRect(left + 8, top + 3, paddle.w - 16, paddle.h - 6, 3);
        ctx.fill();

        if (hasLasers) {
          ctx.fillStyle = '#f43f5e';
          ctx.fillRect(left + 6, top - 5, 4, 6);
          ctx.fillRect(left + paddle.w - 10, top - 5, 4, 6);
        }
        ctx.restore();
      }

      /* --------------------------------------------------------------------------
         11. LOOP PRINCIPAL (FIXED TIMESTEP SUB-STEPS PARA ZERO TUNNELING)
         -------------------------------------------------------------------------- */
      let lastTime = 0;

      function gameLoop(timestamp) {
        if (!lastTime) lastTime = timestamp;
        const rawDt = (timestamp - lastTime) / 1000;
        lastTime = timestamp;
        const dt = Math.min(rawDt, 0.05);

        if (state.status === 'playing') {
          updatePaddles(dt);

          const subSteps = 3;
          const subDt = dt / subSteps;
          for (let s = 0; s < subSteps; s++) {
            updateBalls(subDt);
            if (state.status !== 'playing') break;
          }

          if (state.status === 'playing') {
            updateLasersAndPowerUps(dt);
          }
          updateEffects(dt);
        }

        render();
        requestAnimationFrame(gameLoop);
      }

      /* --------------------------------------------------------------------------
         12. CONTROLES HÍBRIDOS (TECLADO, MOUSE & MULTI-TOUCH DIRETO NA ARENA)
         -------------------------------------------------------------------------- */
      window.addEventListener('keydown', (e) => {
        if (['ArrowLeft', 'ArrowRight', 'Space', ' '].includes(e.key)) {
          e.preventDefault();
        }

        const key = e.key.toLowerCase();
        if (state.mode === 'pong2p') {
          if (e.key === 'ArrowLeft') state.keys.left = true;
          if (e.key === 'ArrowRight') state.keys.right = true;
          if (key === 'a' || key === 'w') state.keys.p2Left = true;
          if (key === 'd' || key === 's') state.keys.p2Right = true;
        } else {
          if (e.key === 'ArrowLeft' || key === 'a') state.keys.left = true;
          if (e.key === 'ArrowRight' || key === 'd') state.keys.right = true;
        }

        if (e.key === ' ' || e.key === 'Enter') {
          if (state.status !== 'playing') {
            handleOverlayButton();
          } else {
            triggerPrimaryAction();
          }
        } else if (key === 'p' || e.key === 'Escape') {
          togglePause();
        }
      });

      window.addEventListener('keyup', (e) => {
        const key = e.key.toLowerCase();
        if (state.mode === 'pong2p') {
          if (e.key === 'ArrowLeft') state.keys.left = false;
          if (e.key === 'ArrowRight') state.keys.right = false;
          if (key === 'a' || key === 'w') state.keys.p2Left = false;
          if (key === 'd' || key === 's') state.keys.p2Right = false;
        } else {
          if (e.key === 'ArrowLeft' || key === 'a') state.keys.left = false;
          if (e.key === 'ArrowRight' || key === 'd') state.keys.right = false;
        }
      });

      function clientToWorld(clientX, clientY) {
        const rect = canvas.getBoundingClientRect();
        const wx = ((clientX - rect.left) / rect.width) * WORLD_W;
        const wy = ((clientY - rect.top) / rect.height) * WORLD_H;
        return { x: wx, y: wy };
      }

      function handlePointerMoveWorld(pos) {
        if (state.status !== 'playing') return;

        if (state.mode === 'pong2p') {
          if (pos.y < WORLD_H / 2) {
            const halfW2 = state.p2.w / 2;
            state.p2.x = Math.max(halfW2 + 6, Math.min(WORLD_W - halfW2 - 6, pos.x));
          } else {
            const halfW1 = state.p1.w / 2;
            state.p1.x = Math.max(halfW1 + 6, Math.min(WORLD_W - halfW1 - 6, pos.x));
          }
        } else {
          const halfW1 = state.p1.w / 2;
          state.p1.x = Math.max(halfW1 + 6, Math.min(WORLD_W - halfW1 - 6, pos.x));
        }
      }

      canvas.addEventListener('pointerdown', (e) => {
        sound.ensureContext();
        canvas.setPointerCapture(e.pointerId);
        const pos = clientToWorld(e.clientX, e.clientY);
        state.pointers.set(e.pointerId, pos);
        handlePointerMoveWorld(pos);
        triggerPrimaryAction();
      });

      canvas.addEventListener('pointermove', (e) => {
        if (e.pointerType === 'mouse' || state.pointers.has(e.pointerId)) {
          const pos = clientToWorld(e.clientX, e.clientY);
          handlePointerMoveWorld(pos);
        }
      });

      canvas.addEventListener('pointerup', (e) => {
        state.pointers.delete(e.pointerId);
      });

      canvas.addEventListener('pointercancel', (e) => {
        state.pointers.delete(e.pointerId);
      });

      function bindDockButtons() {
        const bindHold = (id, keyName) => {
          const el = document.getElementById(id);
          if (!el) return;
          const setPressed = (val) => {
            state.keys[keyName] = val;
            el.classList.toggle('pressed', val);
          };
          el.addEventListener('pointerdown', (e) => {
            e.preventDefault();
            sound.ensureContext();
            setPressed(true);
          });
          el.addEventListener('pointerup', () => setPressed(false));
          el.addEventListener('pointerleave', () => setPressed(false));
          el.addEventListener('pointercancel', () => setPressed(false));
        };

        bindHold('btn-left', 'left');
        bindHold('btn-right', 'right');
        bindHold('btn-p2-left', 'p2Left');
        bindHold('btn-p2-right', 'p2Right');

        const actionBtn = document.getElementById('btn-action');
        if (actionBtn) {
          actionBtn.addEventListener('pointerdown', (e) => {
            e.preventDefault();
            actionBtn.classList.add('pressed');
            triggerPrimaryAction();
          });
          actionBtn.addEventListener('pointerup', () => actionBtn.classList.remove('pressed'));
          actionBtn.addEventListener('pointerleave', () => actionBtn.classList.remove('pressed'));
        }
      }

      /* --------------------------------------------------------------------------
         13. EVENTOS DO CABEÇALHO & OVERLAY
         -------------------------------------------------------------------------- */
      function togglePause() {
        if (state.status === 'playing') {
          state.status = 'paused';
          showOverlay({
            title: '⏸ JOGO PAUSADO',
            desc: 'A partida está em pausa. Clique abaixo ou pressione <b>P</b> para continuar.',
            btnText: '▶ RETOMAR',
            action: 'resume'
          });
        } else if (state.status === 'paused') {
          state.status = 'playing';
          hideOverlay();
        }
      }

      function handleOverlayButton() {
        sound.ensureContext();
        const act = state.overlayAction;

        if (act === 'start' || act === 'resume') {
          state.status = 'playing';
          hideOverlay();
        } else if (act === 'next_stage') {
          state.stage++;
          initArkanoid(false);
          state.status = 'playing';
          hideOverlay();
        } else if (act === 'restart') {
          if (state.mode === 'arkanoid') {
            initArkanoid(true);
          } else {
            initPong();
          }
          state.status = 'playing';
          hideOverlay();
        }
      }

      overlayBtn.addEventListener('click', handleOverlayButton);

      document.querySelectorAll('.mode-btn').forEach((btn) => {
        btn.addEventListener('click', () => {
          sound.ensureContext();
          switchMode(btn.dataset.mode);
        });
      });

      document.getElementById('btn-theme').addEventListener('click', () => {
        sound.ensureContext();
        applyTheme(state.theme === 'neon' ? 'retro' : 'neon');
      });

      document.getElementById('btn-sound').addEventListener('click', () => {
        sound.toggleMute();
        updateSoundButton();
        if (!sound.muted) sound.paddleHit(0.3);
      });

      document.getElementById('btn-pause').addEventListener('click', () => {
        sound.ensureContext();
        togglePause();
      });

      document.getElementById('btn-restart').addEventListener('click', () => {
        sound.ensureContext();
        if (state.mode === 'arkanoid') {
          initArkanoid(true);
        } else {
          initPong();
        }
        state.status = 'playing';
        hideOverlay();
      });

      document.getElementById('btn-dock-toggle').addEventListener('click', () => {
        touchDock.classList.toggle('hidden');
        setTimeout(resizeCanvas, 20);
      });

      /* --------------------------------------------------------------------------
         14. BOOTSTRAP INICIAL
         -------------------------------------------------------------------------- */
      applyTheme(state.theme);
      updateSoundButton();
      switchMode('arkanoid');
      resizeCanvas();
      requestAnimationFrame(gameLoop);
    })();
  </script>
</body>
</html>
