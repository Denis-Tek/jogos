<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Two Dots — Puzzle de Conexões</title>
  <style>
    /* Tokens de Design e Variáveis de Tema (Claro / Escuro) */
    :root {
      --bg: #f4f6f9;
      --surface: #ffffff;
      --surface-alt: #eef1f6;
      --text: #1e293b;
      --text-muted: #64748b;
      --border: #cbd5e1;
      --shadow: 0 10px 25px -5px rgba(15, 23, 42, 0.08);
      --accent: #3b82f6;

      /* Paleta de 5 cores vibrantes (Modo Claro) */
      --dot-0: #ef4444; /* Vermelho Coral */
      --dot-1: #3b82f6; /* Azul Oceano */
      --dot-2: #10b981; /* Verde Esmeralda */
      --dot-3: #f59e0b; /* Amarelo Âmbar */
      --dot-4: #8b5cf6; /* Roxo Violeta */
    }

    [data-theme="dark"] {
      --bg: #0f172a;
      --surface: #1e293b;
      --surface-alt: #334155;
      --text: #f1f5f9;
      --text-muted: #94a3b8;
      --border: #475569;
      --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.45);
      --accent: #60a5fa;

      /* Paleta de 5 cores vibrantes (Modo Escuro) */
      --dot-0: #f87171;
      --dot-1: #60a5fa;
      --dot-2: #34d399;
      --dot-3: #fbbf24;
      --dot-4: #a78bfa;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    html, body {
      height: 100dvh;
      width: 100%;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      transition: background 0.25s ease, color 0.25s ease;
    }

    .app {
      height: 100dvh;
      max-width: 520px;
      margin: 0 auto;
      padding: 12px 16px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 10px;
    }

    /* Cabeçalho */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      flex-shrink: 0;
    }

    .title-group {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .logo-dots {
      display: grid;
      grid-template-columns: repeat(2, 9px);
      gap: 3px;
    }

    .logo-dots span {
      width: 9px;
      height: 9px;
      border-radius: 50%;
    }

    .title-group h1 {
      font-size: 1.3rem;
      font-weight: 800;
      letter-spacing: -0.02em;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .icon-btn {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
      width: 38px;
      height: 38px;
      border-radius: 10px;
      font-size: 1.05rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      box-shadow: var(--shadow);
      transition: transform 0.12s ease, background 0.2s ease;
    }

    .icon-btn:active {
      transform: scale(0.94);
    }

    /* Seletor de Modo de Jogo */
    .mode-bar {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
      background: var(--surface);
      padding: 5px;
      border-radius: 14px;
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
      flex-shrink: 0;
    }

    .mode-btn {
      border: none;
      background: transparent;
      color: var(--text-muted);
      padding: 7px 6px;
      border-radius: 10px;
      font-size: 0.8rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .mode-btn.active {
      background: var(--surface-alt);
      color: var(--text);
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.06);
    }

    /* HUD de Pontuação e Status */
    .hud {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      flex-shrink: 0;
    }

    .stat-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 8px 10px;
      text-align: center;
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .stat-label {
      font-size: 0.66rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
    }

    .stat-value {
      font-size: 1.35rem;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
      margin-top: 1px;
    }

    .stat-value.urgent {
      color: #ef4444;
      animation: pulseText 0.75s infinite alternate;
    }

    @keyframes pulseText {
      from { transform: scale(1); }
      to { transform: scale(1.08); }
    }

    /* Barra de Progresso do Cronômetro */
    .timer-track {
      height: 5px;
      width: 100%;
      background: var(--surface-alt);
      border-radius: 999px;
      overflow: hidden;
      opacity: 0;
      transition: opacity 0.2s ease;
      flex-shrink: 0;
    }

    .timer-track.visible {
      opacity: 1;
    }

    .timer-fill {
      height: 100%;
      width: 100%;
      background: var(--accent);
      border-radius: 999px;
      transition: width 0.25s linear, background-color 0.3s ease;
    }

    /* Área Central do Tabuleiro */
    .stage {
      flex: 1;
      min-height: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    .board-shell {
      position: relative;
      height: 100%;
      max-height: 100%;
      aspect-ratio: 1 / 1;
      max-width: 100%;
      background: var(--surface);
      border: 2.5px solid var(--border);
      border-radius: 22px;
      padding: 14px;
      box-shadow: var(--shadow);
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
      touch-action: none;
    }

    /* Fallback para viewports muito largas onde a largura limita antes da altura */
    @supports not (aspect-ratio: 1 / 1) {
      .board-shell {
        width: min(86vw, 440px);
        height: min(86vw, 440px);
      }
    }

    .board-shell.square-active {
      border-color: var(--active-color, var(--accent));
      box-shadow: 0 0 0 5px color-mix(in srgb, var(--active-color, var(--accent)) 28%, transparent), var(--shadow);
    }

    /* Camada SVG sobreposta apenas para linhas de conexão */
    svg#lineLayer {
      position: absolute;
      inset: 14px;
      width: calc(100% - 28px);
      height: calc(100% - 28px);
      pointer-events: none;
      z-index: 2;
      overflow: visible;
    }

    /* Grade 6x6 DOM com hitboxes precisas */
    .dot-grid {
      position: relative;
      width: 100%;
      height: 100%;
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      grid-template-rows: repeat(6, 1fr);
      z-index: 3;
      touch-action: none;
    }

    .dot-cell {
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      position: relative;
      touch-action: none;
    }

    .dot-ball {
      width: 56%;
      height: 56%;
      border-radius: 50%;
      background-color: var(--dot-color);
      position: relative;
      pointer-events: none;
      transition: transform 0.16s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.18s ease, box-shadow 0.18s ease;
      box-shadow: inset 0 -3px 0 rgba(0, 0, 0, 0.14);
    }

    /* Reflexo sutil no topo da bolinha */
    .dot-ball::after {
      content: "";
      position: absolute;
      top: 18%;
      left: 20%;
      width: 26%;
      height: 26%;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.34);
    }

    .dot-cell.selected .dot-ball {
      transform: scale(1.22);
      box-shadow: 0 0 0 6px color-mix(in srgb, var(--dot-color) 28%, transparent), inset 0 -3px 0 rgba(0, 0, 0, 0.14);
    }

    .dot-cell.square-target .dot-ball {
      transform: scale(1.2);
      box-shadow: 0 0 0 7px color-mix(in srgb, var(--dot-color) 32%, transparent);
    }

    .dot-cell.popping .dot-ball {
      transform: scale(0.05);
      opacity: 0;
    }

    @keyframes dropIn {
      0% {
        transform: translateY(var(--drop-offset, -120%)) scale(0.85);
        opacity: 0.4;
      }
      75% {
        transform: translateY(6%) scale(1.03);
        opacity: 1;
      }
      100% {
        transform: translateY(0) scale(1);
        opacity: 1;
      }
    }

    .dot-ball.falling {
      animation: dropIn 0.34s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    /* Badge flutuante (QUADRADO! / Embaralhando / Pontos) */
    .toast-banner {
      position: absolute;
      top: -14px;
      left: 50%;
      transform: translateX(-50%) translateY(6px);
      background: var(--surface);
      border: 2px solid var(--accent);
      color: var(--text);
      padding: 4px 14px;
      border-radius: 999px;
      font-size: 0.76rem;
      font-weight: 800;
      letter-spacing: 0.04em;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.16);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.18s ease, transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
      z-index: 15;
      white-space: nowrap;
    }

    .toast-banner.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    .score-pop {
      position: absolute;
      pointer-events: none;
      font-weight: 900;
      font-size: 1.25rem;
      z-index: 20;
      transform: translate(-50%, -50%);
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.18);
      animation: floatScore 0.75s ease-out forwards;
    }

    @keyframes floatScore {
      0% { opacity: 1; transform: translate(-50%, -30%) scale(0.8); }
      30% { opacity: 1; transform: translate(-50%, -70%) scale(1.12); }
      100% { opacity: 0; transform: translate(-50%, -140%) scale(1); }
    }

    /* Rodapé */
    footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 0.75rem;
      color: var(--text-muted);
      padding: 0 4px;
      flex-shrink: 0;
    }

    .chain-preview {
      font-weight: 700;
      color: var(--text);
    }

    /* Modal Fim de Jogo */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.62);
      backdrop-filter: blur(4px);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 50;
    }

    .modal-backdrop.open {
      display: flex;
      animation: fadeIn 0.2s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .modal {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 22px;
      padding: 24px;
      width: 100%;
      max-width: 350px;
      text-align: center;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
    }

    .modal-emoji {
      font-size: 2.8rem;
      margin-bottom: 6px;
    }

    .modal h2 {
      font-size: 1.4rem;
      font-weight: 800;
      margin-bottom: 4px;
    }

    .modal p {
      color: var(--text-muted);
      font-size: 0.88rem;
      margin-bottom: 18px;
    }

    .modal-stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 20px;
    }

    .modal-stat-box {
      background: var(--surface-alt);
      padding: 10px;
      border-radius: 12px;
    }

    .modal-stat-box span {
      display: block;
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
      color: var(--text-muted);
    }

    .modal-stat-box strong {
      font-size: 1.55rem;
      font-weight: 800;
    }

    .btn-primary {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 12px;
      background: var(--accent);
      color: #ffffff;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.1s ease, opacity 0.15s ease;
    }

    .btn-primary:active {
      transform: scale(0.98);
    }

    @media (max-width: 400px) {
      .app { padding: 10px 10px; gap: 8px; }
      .stat-value { font-size: 1.2rem; }
      .mode-btn { font-size: 0.74rem; padding: 6px 4px; }
      .board-shell { padding: 10px; }
      svg#lineLayer { inset: 10px; width: calc(100% - 20px); height: calc(100% - 20px); }
    }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <div class="title-group">
        <div class="logo-dots" aria-hidden="true">
          <span style="background: var(--dot-0)"></span>
          <span style="background: var(--dot-1)"></span>
          <span style="background: var(--dot-2)"></span>
          <span style="background: var(--dot-3)"></span>
        </div>
        <h1>Two Dots</h1>
      </div>
      <div class="header-actions">
        <button class="icon-btn" id="soundBtn" title="Alternar Som" aria-label="Alternar Som">🔊</button>
        <button class="icon-btn" id="themeBtn" title="Alternar Tema" aria-label="Alternar Tema">☀️</button>
        <button class="icon-btn" id="restartBtn" title="Nova Partida" aria-label="Nova Partida">🔄</button>
      </div>
    </header>

    <nav class="mode-bar" aria-label="Modos de Jogo">
      <button class="mode-btn active" data-mode="moves">30 Movimentos</button>
      <button class="mode-btn" data-mode="timed">60 Segundos</button>
      <button class="mode-btn" data-mode="zen">Infinito / Zen</button>
    </nav>

    <section class="hud" aria-label="Placar e Status">
      <div class="stat-card">
        <span class="stat-label" id="limitLabel">Movimentos</span>
        <span class="stat-value" id="limitValue">30</span>
      </div>
      <div class="stat-card">
        <span class="stat-label">Pontos</span>
        <span class="stat-value" id="scoreValue">0</span>
      </div>
      <div class="stat-card">
        <span class="stat-label">Recorde</span>
        <span class="stat-value" id="bestValue">0</span>
      </div>
    </section>

    <div class="timer-track" id="timerTrack">
      <div class="timer-fill" id="timerFill"></div>
    </div>

    <main class="stage">
      <div class="board-shell" id="boardShell">
        <div class="toast-banner" id="toastBanner">QUADRADO! Limpa toda a cor</div>
        <svg id="lineLayer" viewBox="0 0 600 600" preserveAspectRatio="none" aria-hidden="true"></svg>
        <div class="dot-grid" id="dotGrid" role="grid" aria-label="Tabuleiro 6 por 6"></div>
      </div>
    </main>

    <footer>
      <span>Arraste entre pontos iguais • Feche um quadrado!</span>
      <span class="chain-preview" id="chainInfo">Pronto</span>
    </footer>
  </div>

  <!-- Modal Fim de Jogo -->
  <div class="modal-backdrop" id="endModal">
    <div class="modal">
      <div class="modal-emoji" id="modalEmoji">✨</div>
      <h2 id="modalTitle">Fim de Rodada!</h2>
      <p id="modalSubtitle">Ótima sequência de conexões.</p>
      <div class="modal-stats">
        <div class="modal-stat-box">
          <span>Pontuação</span>
          <strong id="finalScore">0</strong>
        </div>
        <div class="modal-stat-box">
          <span>Recorde</span>
          <strong id="finalBest">0</strong>
        </div>
      </div>
      <button class="btn-primary" id="playAgainBtn">Jogar Novamente</button>
    </div>
  </div>

  <script>
    (() => {
      // --- Constantes do Jogo ---
      const GRID_SIZE = 6;
      const NUM_COLORS = 5;
      const INITIAL_MOVES = 30;
      const INITIAL_TIME = 60;

      // Escala pentatônica maior ascendente (em Hz)
      const PENTATONIC = [
        261.63, 293.66, 329.63, 392.00, 440.00,
        523.25, 587.33, 659.25, 783.99, 880.00, 1046.50
      ];

      // --- Sintetizador de Áudio (Web Audio API) ---
      class SoundEngine {
        constructor() {
          this.enabled = true;
          this.ctx = null;
        }

        ensureContext() {
          if (!this.ctx) {
            const AudioCtx = window.AudioContext || window.webkitAudioContext;
            if (AudioCtx) this.ctx = new AudioCtx();
          }
          if (this.ctx && this.ctx.state === 'suspended') {
            this.ctx.resume();
          }
        }

        playTone(freq, type = 'sine', duration = 0.15, gainVal = 0.14, delay = 0) {
          if (!this.enabled) return;
          try {
            this.ensureContext();
            if (!this.ctx) return;

            const now = this.ctx.currentTime + delay;
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();

            osc.type = type;
            osc.frequency.setValueAtTime(freq, now);

            gain.gain.setValueAtTime(0.001, now);
            gain.gain.exponentialRampToValueAtTime(gainVal, now + 0.015);
            gain.gain.exponentialRampToValueAtTime(0.001, now + duration);

            osc.connect(gain);
            gain.connect(this.ctx.destination);

            osc.start(now);
            osc.stop(now + duration + 0.02);
          } catch (e) {
            // Ignora restrições antes da primeira interação
          }
        }

        connectStep(step) {
          const idx = Math.min(step, PENTATONIC.length - 1);
          const f = PENTATONIC[idx];
          this.playTone(f, 'sine', 0.16, 0.15);
          this.playTone(f * 2, 'triangle', 0.1, 0.04);
        }

        undoStep(step) {
          const idx = Math.max(0, Math.min(step, PENTATONIC.length - 1));
          this.playTone(PENTATONIC[idx] * 0.85, 'sine', 0.1, 0.1);
        }

        squareFormed() {
          [523.25, 659.25, 783.99, 1174.66].forEach((f, i) => {
            this.playTone(f, 'triangle', 0.3, 0.14, i * 0.045);
          });
        }

        clearPop(count, isSquare) {
          const base = isSquare ? 440 : 330;
          this.playTone(base, 'sine', 0.16, 0.15, 0);
          this.playTone(base * 1.5, 'triangle', 0.2, 0.13, 0.05);
          if (count >= 5 || isSquare) {
            this.playTone(base * 2, 'sine', 0.24, 0.11, 0.1);
          }
        }

        gameOver(isNewRecord) {
          const seq = isNewRecord
            ? [523.25, 659.25, 783.99, 1046.5, 1318.5]
            : [523.25, 493.88, 440.0, 392.0];
          seq.forEach((f, i) => {
            this.playTone(f, 'triangle', 0.24, 0.14, i * 0.1);
          });
        }
      }

      const sfx = new SoundEngine();

      // --- Estado do Jogo ---
      const state = {
        mode: 'moves', // 'moves' | 'timed' | 'zen'
        grid: [],      // [row][col] -> número da cor (0..4)
        cells: [],     // [row][col] -> referência DOM .dot-cell
        chain: [],     // Array de { r, c }
        isSquare: false,
        dragging: false,
        score: 0,
        movesLeft: INITIAL_MOVES,
        timeLeft: INITIAL_TIME,
        timerInterval: null,
        locked: false,
        gameOver: false
      };

      // --- Referências DOM ---
      const boardShell = document.getElementById('boardShell');
      const dotGridEl = document.getElementById('dotGrid');
      const lineLayer = document.getElementById('lineLayer');
      const toastBanner = document.getElementById('toastBanner');
      const chainInfo = document.getElementById('chainInfo');

      const themeBtn = document.getElementById('themeBtn');
      const soundBtn = document.getElementById('soundBtn');
      const restartBtn = document.getElementById('restartBtn');
      const modeBtns = document.querySelectorAll('.mode-btn');

      const limitLabel = document.getElementById('limitLabel');
      const limitValue = document.getElementById('limitValue');
      const scoreValue = document.getElementById('scoreValue');
      const bestValue = document.getElementById('bestValue');
      const timerTrack = document.getElementById('timerTrack');
      const timerFill = document.getElementById('timerFill');

      const endModal = document.getElementById('endModal');
      const modalEmoji = document.getElementById('modalEmoji');
      const modalTitle = document.getElementById('modalTitle');
      const modalSubtitle = document.getElementById('modalSubtitle');
      const finalScore = document.getElementById('finalScore');
      const finalBest = document.getElementById('finalBest');
      const playAgainBtn = document.getElementById('playAgainBtn');

      // --- Tema Claro / Escuro ---
      let isDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
      function applyTheme() {
        document.documentElement.setAttribute('data-theme', isDark ? 'dark' : 'light');
        themeBtn.textContent = isDark ? '🌙' : '☀️';
      }
      applyTheme();

      themeBtn.addEventListener('click', () => {
        isDark = !isDark;
        applyTheme();
      });

      soundBtn.addEventListener('click', () => {
        sfx.enabled = !sfx.enabled;
        soundBtn.textContent = sfx.enabled ? '🔊' : '🔇';
        if (sfx.enabled) sfx.connectStep(2);
      });

      // --- Persistência de Recordes ---
      function getBestKey(mode) {
        return `twodots_best_${mode}`;
      }

      function loadBest(mode) {
        try {
          return parseInt(localStorage.getItem(getBestKey(mode)) || '0', 10) || 0;
        } catch (e) {
          return 0;
        }
      }

      function saveBest(mode, score) {
        try {
          const prev = loadBest(mode);
          if (score > prev) {
            localStorage.setItem(getBestKey(mode), String(score));
            return true;
          }
        } catch (e) {
          // Ignora modo privado
        }
        return false;
      }

      // --- Construção da Grade DOM 6x6 ---
      function buildGridDOM() {
        dotGridEl.innerHTML = '';
        state.cells = Array.from({ length: GRID_SIZE }, () => Array(GRID_SIZE).fill(null));

        for (let r = 0; r < GRID_SIZE; r++) {
          for (let c = 0; c < GRID_SIZE; c++) {
            const cell = document.createElement('div');
            cell.className = 'dot-cell';
            cell.dataset.row = String(r);
            cell.dataset.col = String(c);

            const ball = document.createElement('div');
            ball.className = 'dot-ball';
            cell.appendChild(ball);

            dotGridEl.appendChild(cell);
            state.cells[r][c] = cell;
          }
        }
      }

      function randomColor() {
        return Math.floor(Math.random() * NUM_COLORS);
      }

      function renderAllDots(dropOffsets = null) {
        for (let r = 0; r < GRID_SIZE; r++) {
          for (let c = 0; c < GRID_SIZE; c++) {
            const cell = state.cells[r][c];
            const ball = cell.firstElementChild;
            const colorIdx = state.grid[r][c];

            cell.className = 'dot-cell';
            ball.style.setProperty('--dot-color', `var(--dot-${colorIdx})`);
            ball.classList.remove('falling');

            if (dropOffsets && dropOffsets[r][c] > 0) {
              const dist = dropOffsets[r][c] * 100;
              ball.style.setProperty('--drop-offset', `-${dist}%`);
              // Força reflow para reiniciar animação de queda
              void ball.offsetWidth;
              ball.classList.add('falling');
            }
          }
        }
      }

      // --- Inicialização da Partida ---
      function initGame() {
        clearInterval(state.timerInterval);
        state.timerInterval = null;
        state.chain = [];
        state.isSquare = false;
        state.dragging = false;
        state.score = 0;
        state.movesLeft = INITIAL_MOVES;
        state.timeLeft = INITIAL_TIME;
        state.locked = false;
        state.gameOver = false;

        endModal.classList.remove('open');
        boardShell.classList.remove('square-active');
        hideToast();
        clearLines();

        if (state.cells.length === 0) {
          buildGridDOM();
        }

        state.grid = Array.from({ length: GRID_SIZE }, () =>
          Array.from({ length: GRID_SIZE }, () => randomColor())
        );

        ensurePlayableBoard(false);

        const initialDrops = Array.from({ length: GRID_SIZE }, (_, r) =>
          Array.from({ length: GRID_SIZE }, () => GRID_SIZE - r)
        );
        renderAllDots(initialDrops);
        updateHUD();
        updateChainVisuals();

        if (state.mode === 'timed') {
          startTimer();
        }
      }

      function startTimer() {
        clearInterval(state.timerInterval);
        state.timerInterval = setInterval(() => {
          if (state.gameOver) {
            clearInterval(state.timerInterval);
            return;
          }
          state.timeLeft--;
          updateHUD();
          if (state.timeLeft <= 0) {
            state.timeLeft = 0;
            updateHUD();
            triggerGameOver();
          }
        }, 1000);
      }

      // --- Detecção de Deadlock (Sem Jogadas Válidas) ---
      function hasValidMoves() {
        for (let r = 0; r < GRID_SIZE; r++) {
          for (let c = 0; c < GRID_SIZE; c++) {
            const color = state.grid[r][c];
            if (r + 1 < GRID_SIZE && state.grid[r + 1][c] === color) return true;
            if (c + 1 < GRID_SIZE && state.grid[r][c + 1] === color) return true;
          }
        }
        return false;
      }

      function ensurePlayableBoard(notify = true) {
        let shuffled = false;
        let attempts = 0;

        while (!hasValidMoves() && attempts < 20) {
          attempts++;
          shuffled = true;
          const flat = state.grid.flat();
          for (let i = flat.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [flat[i], flat[j]] = [flat[j], flat[i]];
          }
          for (let r = 0; r < GRID_SIZE; r++) {
            for (let c = 0; c < GRID_SIZE; c++) {
              state.grid[r][c] = flat[r * GRID_SIZE + c];
            }
          }
          if (!hasValidMoves()) {
            state.grid[0][1] = state.grid[0][0];
          }
        }

        if (shuffled && notify) {
          renderAllDots();
          showToast('Sem jogadas! Embaralhando...', 'var(--accent)');
        }
      }

      // --- Toast e Textos Flutuantes ---
      let toastTimer = null;
      function showToast(text, borderColor = 'var(--accent)', persistent = false) {
        toastBanner.textContent = text;
        toastBanner.style.borderColor = borderColor;
        toastBanner.classList.add('show');
        clearTimeout(toastTimer);
        if (!persistent) {
          toastTimer = setTimeout(() => {
            toastBanner.classList.remove('show');
          }, 1500);
        }
      }

      function hideToast() {
        clearTimeout(toastTimer);
        toastBanner.classList.remove('show');
      }

      function spawnScorePop(r, c, text, colorVar) {
        const pop = document.createElement('div');
        pop.className = 'score-pop';
        pop.textContent = text;
        pop.style.color = colorVar;
        pop.style.left = `${((c + 0.5) / GRID_SIZE) * 100}%`;
        pop.style.top = `${((r + 0.5) / GRID_SIZE) * 100}%`;
        boardShell.appendChild(pop);
        setTimeout(() => pop.remove(), 760);
      }

      // --- Interação de Arrasto (elementFromPoint + releasePointerCapture) ---
      function getCellFromPoint(clientX, clientY) {
        const target = document.elementFromPoint(clientX, clientY);
        if (!target) return null;
        const cell = target.closest('.dot-cell');
        if (!cell || !dotGridEl.contains(cell)) return null;
        return {
          r: parseInt(cell.dataset.row, 10),
          c: parseInt(cell.dataset.col, 10)
        };
      }

      function isAdjacent(a, b) {
        return Math.abs(a.r - b.r) + Math.abs(a.c - b.c) === 1;
      }

      function sameCell(a, b) {
        return a.r === b.r && a.c === b.c;
      }

      dotGridEl.addEventListener('pointerdown', (e) => {
        if (state.locked || state.gameOver) return;
        e.preventDefault();

        // Libera captura implícita de toque no mobile para que elementFromPoint funcione livremente
        if (e.target && typeof e.target.releasePointerCapture === 'function') {
          try {
            if (e.target.hasPointerCapture(e.pointerId)) {
              e.target.releasePointerCapture(e.pointerId);
            }
          } catch (err) {
            // Ignora caso não haja captura ativa
          }
        }

        const cell = getCellFromPoint(e.clientX, e.clientY);
        if (!cell) return;

        state.dragging = true;
        state.chain = [cell];
        state.isSquare = false;

        sfx.connectStep(0);
        updateChainVisuals(e.clientX, e.clientY);
      });

      window.addEventListener('pointermove', (e) => {
        if (!state.dragging || state.locked || state.gameOver) return;
        e.preventDefault();

        const cell = getCellFromPoint(e.clientX, e.clientY);
        if (cell) {
          const last = state.chain[state.chain.length - 1];

          if (!sameCell(cell, last)) {
            // 1. Backtracking: voltou para o penúltimo ponto da cadeia
            if (state.chain.length >= 2 && sameCell(cell, state.chain[state.chain.length - 2])) {
              state.chain.pop();
              recomputeSquare();
              sfx.undoStep(state.chain.length - 1);
            }
            // 2. Avanço para ponto adjacente da mesma cor
            else if (!state.isSquare && isAdjacent(last, cell)) {
              const activeColor = state.grid[state.chain[0].r][state.chain[0].c];
              if (state.grid[cell.r][cell.c] === activeColor) {
                const existingIdx = state.chain.findIndex(p => sameCell(p, cell));
                if (existingIdx !== -1) {
                  // Fechou um loop/quadrado de pelo menos 4 pontos distintos
                  if (state.chain.length - existingIdx >= 4) {
                    state.chain.push(cell);
                    state.isSquare = true;
                    sfx.squareFormed();
                  }
                } else {
                  state.chain.push(cell);
                  sfx.connectStep(state.chain.length - 1);
                }
              }
            }
          }
        }

        updateChainVisuals(e.clientX, e.clientY);
      }, { passive: false });

      function finishDrag() {
        if (!state.dragging) return;
        state.dragging = false;

        if (state.chain.length >= 2) {
          resolveChain();
        } else {
          state.chain = [];
          state.isSquare = false;
          updateChainVisuals();
        }
      }

      window.addEventListener('pointerup', finishDrag);
      window.addEventListener('pointercancel', finishDrag);

      function recomputeSquare() {
        if (state.chain.length < 5) {
          state.isSquare = false;
          return;
        }
        const tip = state.chain[state.chain.length - 1];
        const firstIdx = state.chain.findIndex(p => sameCell(p, tip));
        state.isSquare = firstIdx !== -1 && firstIdx < state.chain.length - 1;
      }

      // --- Renderização das Linhas SVG e Destaques ---
      function clearLines() {
        lineLayer.innerHTML = '';
      }

      function updateChainVisuals(pointerX = null, pointerY = null) {
        // Limpa estados visuais anteriores das células
        for (let r = 0; r < GRID_SIZE; r++) {
          for (let c = 0; c < GRID_SIZE; c++) {
            state.cells[r][c].classList.remove('selected', 'square-target');
          }
        }

        clearLines();

        if (state.chain.length === 0) {
          boardShell.classList.remove('square-active');
          hideToast();
          chainInfo.textContent = 'Pronto';
          return;
        }

        const first = state.chain[0];
        const activeColorIdx = state.grid[first.r][first.c];
        const colorVar = `var(--dot-${activeColorIdx})`;

        boardShell.style.setProperty('--active-color', colorVar);

        // Marca bolinhas conectadas
        for (const p of state.chain) {
          state.cells[p.r][p.c].classList.add('selected');
        }

        // Se fechou quadrado, destaca TODAS as bolinhas daquela cor no tabuleiro
        if (state.isSquare) {
          boardShell.classList.add('square-active');
          showToast('QUADRADO! Limpa toda a cor', colorVar, true);
          chainInfo.textContent = `Quadrado (${state.chain.length - 1} pts)`;

          for (let r = 0; r < GRID_SIZE; r++) {
            for (let c = 0; c < GRID_SIZE; c++) {
              if (state.grid[r][c] === activeColorIdx) {
                state.cells[r][c].classList.add('square-target');
              }
            }
          }
        } else {
          boardShell.classList.remove('square-active');
          hideToast();
          chainInfo.textContent = `${state.chain.length} conectado${state.chain.length > 1 ? 's' : ''}`;
        }

        // Desenha polilinha SVG conectando os centros (viewBox 600x600 -> cada célula = 100x100)
        const points = state.chain.map(p => `${p.c * 100 + 50},${p.r * 100 + 50}`);

        // Linha guia até o cursor/dedo enquanto arrasta
        if (state.dragging && !state.isSquare && pointerX !== null && pointerY !== null) {
          const rect = lineLayer.getBoundingClientRect();
          if (rect.width > 0 && rect.height > 0) {
            const vx = ((pointerX - rect.left) / rect.width) * 600;
            const vy = ((pointerY - rect.top) / rect.height) * 600;
            points.push(`${vx.toFixed(1)},${vy.toFixed(1)}`);
          }
        }

        if (points.length >= 2) {
          const polyline = document.createElementNS('http://www.w3.org/2000/svg', 'polyline');
          polyline.setAttribute('points', points.join(' '));
          polyline.setAttribute('fill', state.isSquare ? colorVar : 'none');
          polyline.setAttribute('fill-opacity', state.isSquare ? '0.14' : '0');
          polyline.setAttribute('stroke', colorVar);
          polyline.setAttribute('stroke-width', '14');
          polyline.setAttribute('stroke-linecap', 'round');
          polyline.setAttribute('stroke-linejoin', 'round');
          lineLayer.appendChild(polyline);
        }
      }

      // --- Resolução da Jogada, Pontuação, Gravidade e Reposição ---
      function resolveChain() {
        state.locked = true;
        const first = state.chain[0];
        const activeColorIdx = state.grid[first.r][first.c];
        const colorVar = `var(--dot-${activeColorIdx})`;
        const formedSquare = state.isSquare;

        const toClear = new Set();
        const key = (r, c) => `${r},${c}`;

        if (formedSquare) {
          // Limpa TODOS os pontos dessa cor no tabuleiro inteiro
          for (let r = 0; r < GRID_SIZE; r++) {
            for (let c = 0; c < GRID_SIZE; c++) {
              if (state.grid[r][c] === activeColorIdx) {
                toClear.add(key(r, c));
              }
            }
          }
        } else {
          for (const p of state.chain) {
            toClear.add(key(p.r, p.c));
          }
        }

        const count = toClear.size;
        const earned = formedSquare ? count * 2 : count;
        state.score += earned;

        // Anima saída dos pontos eliminados e calcula centro médio para popup de pontos
        let sumR = 0, sumC = 0;
        toClear.forEach(k => {
          const [r, c] = k.split(',').map(Number);
          sumR += r;
          sumC += c;
          state.cells[r][c].classList.add('popping');
          state.grid[r][c] = null;
        });

        if (count > 0) {
          spawnScorePop(
            sumR / count,
            sumC / count,
            formedSquare ? `+${earned} ★` : `+${earned}`,
            colorVar
          );
        }

        sfx.clearPop(count, formedSquare);

        if (state.mode === 'moves') {
          state.movesLeft = Math.max(0, state.movesLeft - 1);
        }

        state.chain = [];
        state.isSquare = false;
        clearLines();
        boardShell.classList.remove('square-active');
        hideToast();
        chainInfo.textContent = 'Pronto';
        updateHUD();

        // Aplica gravidade e preenche o topo após animação de saída
        setTimeout(() => {
          const dropOffsets = Array.from({ length: GRID_SIZE }, () => Array(GRID_SIZE).fill(0));

          for (let c = 0; c < GRID_SIZE; c++) {
            let writeRow = GRID_SIZE - 1;
            for (let r = GRID_SIZE - 1; r >= 0; r--) {
              if (state.grid[r][c] !== null) {
                const dist = writeRow - r;
                state.grid[writeRow][c] = state.grid[r][c];
                dropOffsets[writeRow][c] = dist;
                if (writeRow !== r) state.grid[r][c] = null;
                writeRow--;
              }
            }

            const newCount = writeRow + 1;
            for (let r = writeRow; r >= 0; r--) {
              state.grid[r][c] = randomColor();
              dropOffsets[r][c] = newCount;
            }
          }

          renderAllDots(dropOffsets);
          ensurePlayableBoard(true);
          state.locked = false;

          if (state.mode === 'moves' && state.movesLeft <= 0) {
            setTimeout(triggerGameOver, 380);
          }
        }, 190);
      }

      // --- Atualização do HUD e Modal Final ---
      function updateHUD() {
        scoreValue.textContent = state.score;
        const best = loadBest(state.mode);
        bestValue.textContent = Math.max(best, state.score);

        if (state.mode === 'moves') {
          limitLabel.textContent = 'Movimentos';
          limitValue.textContent = state.movesLeft;
          limitValue.classList.toggle('urgent', state.movesLeft <= 5 && state.movesLeft > 0);
          timerTrack.classList.remove('visible');
        } else if (state.mode === 'timed') {
          limitLabel.textContent = 'Tempo';
          limitValue.textContent = `${state.timeLeft}s`;
          limitValue.classList.toggle('urgent', state.timeLeft <= 10 && state.timeLeft > 0);
          timerTrack.classList.add('visible');
          const pct = Math.max(0, (state.timeLeft / INITIAL_TIME) * 100);
          timerFill.style.width = `${pct}%`;
          timerFill.style.backgroundColor = state.timeLeft <= 10 ? '#ef4444' : 'var(--accent)';
        } else {
          limitLabel.textContent = 'Modo';
          limitValue.textContent = '∞';
          limitValue.classList.remove('urgent');
          timerTrack.classList.remove('visible');
        }
      }

      function triggerGameOver() {
        if (state.gameOver) return;
        state.gameOver = true;
        state.dragging = false;
        state.chain = [];
        clearInterval(state.timerInterval);
        updateChainVisuals();

        const isRecord = saveBest(state.mode, state.score);
        const best = loadBest(state.mode);

        finalScore.textContent = state.score;
        finalBest.textContent = best;

        if (isRecord && state.score > 0) {
          modalEmoji.textContent = '🏆';
          modalTitle.textContent = 'Novo Recorde!';
          modalSubtitle.textContent = 'Você superou sua melhor marca neste modo.';
        } else {
          modalEmoji.textContent = '✨';
          modalTitle.textContent = state.mode === 'timed' ? 'Tempo Esgotado!' : 'Fim dos Movimentos!';
          modalSubtitle.textContent = 'Feche quadrados para limpar cores inteiras do tabuleiro.';
        }

        sfx.gameOver(isRecord && state.score > 0);
        endModal.classList.add('open');
      }

      // --- Eventos de Interface ---
      modeBtns.forEach(btn => {
        btn.addEventListener('click', () => {
          modeBtns.forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          state.mode = btn.dataset.mode;
          initGame();
        });
      });

      restartBtn.addEventListener('click', initGame);
      playAgainBtn.addEventListener('click', initGame);

      // Inicia primeira partida
      initGame();
    })();
  </script>
</body>
</html>
