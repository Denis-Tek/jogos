<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Mahjong Brasil — Edição Vita</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-start: #1c2f4f;
      --bg-end: #0c1526;
      --tile-face: linear-gradient(165deg, #ffffff 0%, #fcf8ef 70%, #efe5cf 100%);
      --tile-border: #d8c8a6;
      --tile-rim-light: #cbb790;
      --tile-rim-dark: #9c845a;
      --tile-base-accent: #2c436b;
    }

    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100dvh;
      overflow: hidden;
      background: radial-gradient(circle at 50% 42%, var(--bg-start), var(--bg-end));
      color: #f8fafc;
    }

    .felt-texture {
      background-image:
        radial-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 0),
        radial-gradient(rgba(0, 0, 0, 0.16) 1px, transparent 0);
      background-size: 20px 20px;
      background-position: 0 0, 10px 10px;
    }

    /* Peça 3D Tátil com Iluminação Uniforme por Padrão */
    .mj-tile {
      position: absolute;
      border-radius: var(--tile-radius, 11px);
      cursor: pointer;
      transition: transform 0.14s cubic-bezier(0.2, 0.9, 0.3, 1.15), opacity 0.18s ease;
      will-change: transform, opacity;
    }

    .mj-tile-face {
      position: relative;
      width: 100%;
      height: 100%;
      border-radius: var(--tile-radius, 11px);
      background: var(--tile-face);
      border: 1.5px solid var(--tile-border);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 4% 5% 5% 5%;
      box-shadow:
        inset 0 2px 0 rgba(255, 255, 255, 0.98),
        inset 0 -2px 3px rgba(135, 110, 70, 0.16);
      overflow: hidden;
      transition: border-color 0.12s ease, box-shadow 0.12s ease, background 0.12s ease;
    }

    /* Borda inferior espessa em relevo 3D (6px+) */
    .mj-tile::before {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: var(--tile-radius, 11px);
      transform: translate(var(--depth-x, 3px), var(--depth-y, 6px));
      background: linear-gradient(145deg, var(--tile-rim-light) 0%, var(--tile-rim-dark) 62%, var(--tile-base-accent) 100%);
      box-shadow: 2px 6px 11px rgba(0, 0, 0, 0.46);
      z-index: -1;
    }

    /* Modo opcional "Livres": escurece suavemente peças bloqueadas */
    .mj-tile.dim-blocked .mj-tile-face {
      filter: brightness(0.62) saturate(0.75);
    }

    @media (hover: hover) {
      .mj-tile:hover {
        transform: translate(-1.5px, -2.5px);
      }
      .mj-tile:hover .mj-tile-face {
        border-color: #f59e0b;
      }
    }

    /* Peça Selecionada */
    .mj-tile.selected {
      transform: translate(-2px, -6px) scale(1.045) !important;
      z-index: 95000 !important;
    }
    .mj-tile.selected .mj-tile-face {
      background: linear-gradient(165deg, #fffef0 0%, #fef08a 100%);
      border: 2.5px solid #eab308;
      box-shadow:
        0 0 0 3.5px rgba(250, 204, 21, 0.5),
        inset 0 2px 0 #ffffff;
    }

    /* Destaque dourado durante a finalização automática */
    .mj-tile.auto-highlight {
      transform: translate(0, -4px) scale(1.08) !important;
      z-index: 96000 !important;
    }
    .mj-tile.auto-highlight .mj-tile-face {
      background: linear-gradient(165deg, #fffbeb 0%, #fde68a 100%);
      border: 2.5px solid #f59e0b;
      box-shadow:
        0 0 18px 4px rgba(251, 191, 36, 0.85),
        inset 0 2px 0 #ffffff;
    }

    /* Peça Destacada pela Dica */
    .mj-tile.hinted {
      animation: hintBounce 1s infinite ease-in-out;
    }
    .mj-tile.hinted .mj-tile-face {
      background: linear-gradient(165deg, #ecfdf5 0%, #a7f3d0 100%);
      border: 2.5px solid #10b981;
      box-shadow: 0 0 0 3.5px rgba(16, 185, 129, 0.5);
    }

    /* Feedback visual ao clicar em peça bloqueada */
    .mj-tile.blocked-shake {
      animation: blockedShake 0.16s cubic-bezier(0.36, 0.07, 0.19, 0.97) both;
    }
    .mj-tile.blocked-shake .mj-tile-face {
      border-color: #f87171;
      box-shadow: 0 0 0 2.5px rgba(248, 113, 113, 0.45);
    }

    /* Remoção manual suave */
    .mj-tile.removing {
      pointer-events: none;
      opacity: 0;
      transform: scale(0.76) translateY(-6px);
      transition: opacity 0.18s ease-out, transform 0.18s ease-out;
    }

    /* Remoção em cascata na finalização automática */
    .mj-tile.auto-removing {
      pointer-events: none;
      animation: autoFinishOut 0.24s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    @keyframes autoFinishOut {
      0% {
        opacity: 1;
        transform: scale(1.15) translateY(-4px);
      }
      100% {
        opacity: 0;
        transform: scale(0) translateY(-28px);
      }
    }

    @keyframes hintBounce {
      0%, 100% { transform: translate(0, 0) scale(1); }
      50% { transform: translate(-1.5px, -3.5px) scale(1.04); }
    }

    @keyframes blockedShake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-4px); }
      50% { transform: translateX(4px); }
      75% { transform: translateX(-3px); }
    }

    .sparkle-dot {
      position: absolute;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      pointer-events: none;
      z-index: 99000;
      animation: sparkleOut 0.48s ease-out forwards;
    }

    @keyframes sparkleOut {
      0% { transform: translate(0, 0) scale(1); opacity: 1; }
      100% { transform: translate(var(--dx), var(--dy)) scale(0); opacity: 0; }
    }

    .btn-tactile {
      transition: transform 0.1s ease, background-color 0.15s ease;
    }
    .btn-tactile:active:not(:disabled) {
      transform: translateY(2px) scale(0.97);
    }
    .btn-tactile:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    /* Oculta barra de rolagem horizontal mantendo deslize tátil fluido */
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
  </style>
</head>
<body class="felt-texture flex flex-col justify-between">

  <!-- BARRA SUPERIOR COMPACTA NA ORDEM EXATA: 1. Som (ícone) -> 2. Livres -> 3. Peças -> 4. Temas (Bíblia, Brasil, Clássico) -> 5. Formatos -->
  <header class="w-full px-2.5 sm:px-5 py-1.5 flex items-center justify-between gap-2 bg-black/40 backdrop-blur-md border-b border-white/10 z-30 shrink-0 overflow-x-auto no-scrollbar">
    <!-- Grupo Esquerdo: Som, Livres e Contador de Peças -->
    <div class="flex items-center gap-1.5 shrink-0">
      <!-- 1. Botão de Controle de Som (somente ícone, compacto, sem texto) -->
      <button id="soundBtn" aria-label="Alternar som" title="Ativar ou silenciar som" class="btn-tactile p-1.5 rounded-xl bg-black/55 hover:bg-white/15 text-white border border-white/15 flex items-center justify-center cursor-pointer shrink-0">
        <svg id="soundOnIcon" viewBox="0 0 24 24" class="w-4 h-4 text-emerald-300 shrink-0" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
          <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/>
        </svg>
        <svg id="soundOffIcon" viewBox="0 0 24 24" class="w-4 h-4 text-rose-400 hidden shrink-0" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
          <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><line x1="23" y1="9" x2="17" y2="15"/><line x1="17" y1="9" x2="23" y2="15"/>
        </svg>
      </button>

      <!-- 2. Botão toggle 'Livres' -->
      <button id="toggleFreeBtn" title="Opcional: escurece peças bloqueadas para acessibilidade" class="flex items-center gap-1.5 px-2.5 py-1.5 rounded-xl text-xs font-bold border transition-all cursor-pointer shrink-0">
        <span id="freeDot" class="w-2 h-2 rounded-full inline-block"></span>
        <span>Livres</span>
      </button>

      <!-- 3. Contador de Peças restantes -->
      <div class="flex items-center gap-1 bg-black/55 px-2.5 py-1.5 rounded-xl border border-white/15 text-xs shrink-0">
        <span class="text-slate-300 font-bold">Peças:</span>
        <span id="remainingCount" class="font-black text-amber-300">72</span>
      </div>
    </div>

    <!-- Grupo Direito: 4. Seletor de Temas (Bíblia padrão, Brasil, Clássico) -> 5. Formatos/Tamanhos -->
    <div class="flex items-center gap-1.5 shrink-0 sm:ml-auto">
      <div class="flex items-center bg-black/55 p-0.5 rounded-xl border border-white/15 shrink-0" role="group" aria-label="Tema de símbolos">
        <button data-theme="biblia" class="theme-btn px-2.5 py-1 rounded-lg text-xs font-extrabold transition-all cursor-pointer shrink-0">
          🕊️ Bíblia
        </button>
        <button data-theme="brasil" class="theme-btn px-2.5 py-1 rounded-lg text-xs font-extrabold transition-all cursor-pointer shrink-0">
          🇧🇷 Brasil
        </button>
        <button data-theme="classico" class="theme-btn px-2.5 py-1 rounded-lg text-xs font-extrabold transition-all cursor-pointer shrink-0">
          🀄 Clássico
        </button>
      </div>

      <select id="layoutSelect" aria-label="Formato do tabuleiro" class="bg-black/55 text-white text-xs font-bold px-2.5 py-1.5 rounded-xl border border-white/15 focus:outline-none focus:border-amber-400 cursor-pointer shrink-0">
        <option value="desafio_rapido">Desafio Rápido (48)</option>
        <option value="piramide">Pirâmide (60)</option>
        <option value="pao_acucar" selected>Pão de Açúcar (72)</option>
        <option value="coroa">Coroa (84)</option>
        <option value="catedral">Catedral (96)</option>
      </select>
    </div>
  </header>

  <!-- ÁREA CENTRAL DO TABULEIRO -->
  <main id="boardViewport" class="relative flex-1 w-full overflow-hidden flex items-center justify-center">
    <div id="toastBanner" class="pointer-events-none absolute top-2 left-1/2 -translate-x-1/2 z-40 px-3.5 py-1 rounded-full bg-amber-400 text-slate-950 font-extrabold text-xs shadow-lg opacity-0 transition-opacity duration-200">
      Par combinado!
    </div>

    <!-- Indicador discreto durante a finalização automática -->
    <div id="autoFinishBadge" class="pointer-events-none hidden absolute top-3 left-1/2 -translate-x-1/2 z-50 px-4 py-1.5 rounded-full bg-slate-900/90 border border-amber-400/70 text-amber-300 font-extrabold text-xs tracking-wide shadow-xl items-center gap-2 backdrop-blur-md">
      <span class="w-2 h-2 rounded-full bg-amber-400 animate-ping"></span>
      <span>Finalizando...</span>
    </div>

    <div id="boardContainer" class="relative shrink-0"></div>
  </main>

  <!-- BARRA INFERIOR COM ROLAGEM HORIZONTAL E BOTÕES GRANDES -->
  <footer class="w-full bg-black/40 backdrop-blur-md border-t border-white/10 z-30 shrink-0">
    <div class="w-full max-w-4xl mx-auto flex items-center sm:justify-center gap-2 overflow-x-auto no-scrollbar px-3 py-2">
      <button id="undoBtn" class="btn-tactile shrink-0 flex items-center justify-center gap-1.5 px-4 sm:px-5 py-2.5 rounded-2xl bg-slate-800/95 hover:bg-slate-700 text-white font-bold text-xs sm:text-sm border border-white/15 shadow-md cursor-pointer">
        <svg viewBox="0 0 24 24" class="w-4 h-4 sm:w-5 sm:h-5 text-amber-300 shrink-0" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 5.5 5.5v0a5.5 5.5 0 0 1-5.5 5.5H11"/>
        </svg>
        <span>Desfazer</span>
      </button>

      <button id="hintBtn" class="btn-tactile shrink-0 flex items-center justify-center gap-1.5 px-4 sm:px-5 py-2.5 rounded-2xl bg-emerald-600 hover:bg-emerald-500 text-white font-bold text-xs sm:text-sm border border-emerald-300/30 shadow-md cursor-pointer">
        <svg viewBox="0 0 24 24" class="w-4 h-4 sm:w-5 sm:h-5 text-yellow-200 shrink-0" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
          <path d="M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A6 6 0 0 0 6 8c0 1 .2 2.2 1.5 3.5.7.7 1.3 1.5 1.5 2.5"/><path d="M9 18h6"/><path d="M10 22h4"/>
        </svg>
        <span>Dica</span>
      </button>

      <button id="shuffleBtn" class="btn-tactile shrink-0 flex items-center justify-center gap-1.5 px-4 sm:px-5 py-2.5 rounded-2xl bg-amber-500 hover:bg-amber-400 text-slate-950 font-extrabold text-xs sm:text-sm border border-amber-200/50 shadow-md cursor-pointer">
        <svg viewBox="0 0 24 24" class="w-4 h-4 sm:w-5 sm:h-5 shrink-0" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
          <path d="M2 18h1.4c1.3 0 2.5-.6 3.3-1.7l6.1-8.6c.7-1.1 2-1.7 3.3-1.7H22"/><path d="m18 2 4 4-4 4"/><path d="M2 6h1.9c1.5 0 2.9.9 3.6 2.2"/><path d="M22 18h-5.9c-1.3 0-2.6-.7-3.3-1.8l-.5-.8"/><path d="m18 14 4 4-4 4"/>
        </svg>
        <span>Embaralhar</span>
      </button>

      <button id="newGameBtn" class="btn-tactile shrink-0 flex items-center justify-center gap-1.5 px-4 sm:px-5 py-2.5 rounded-2xl bg-slate-800/95 hover:bg-slate-700 text-white font-bold text-xs sm:text-sm border border-white/15 shadow-md cursor-pointer">
        <svg viewBox="0 0 24 24" class="w-4 h-4 sm:w-5 sm:h-5 text-sky-300 shrink-0" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/>
        </svg>
        <span>Novo Jogo</span>
      </button>
    </div>
  </footer>

  <!-- MODAL NO NÍVEL RAIZ DO BODY COM Z-INDEX 999999 E BACKDROP ESCURO -->
  <div id="gameModal" style="z-index: 999999; background-color: rgba(10, 15, 28, 0.84);" class="fixed inset-0 backdrop-blur-sm hidden items-center justify-center p-4">
    <div class="bg-slate-900 border-2 border-amber-400/50 rounded-3xl max-w-md w-full p-6 text-center shadow-2xl">
      <div id="modalIcon" class="w-16 h-16 mx-auto mb-3 rounded-2xl bg-gradient-to-br from-amber-400 to-emerald-500 flex items-center justify-center text-3xl shadow-lg">
        🏆
      </div>
      <h2 id="modalTitle" class="text-2xl font-extrabold text-white mb-1">Tabuleiro Concluído!</h2>
      <p id="modalDesc" class="text-sm text-slate-300 mb-5">Todas as peças foram combinadas com sucesso.</p>

      <div id="modalStats" class="grid grid-cols-2 gap-2 bg-black/40 p-3 rounded-2xl border border-white/10 mb-5">
        <div>
          <span class="block text-[11px] text-slate-400 uppercase">Tempo</span>
          <span id="modalTime" class="text-base font-extrabold text-white">00:00</span>
        </div>
        <div>
          <span class="block text-[11px] text-slate-400 uppercase">Pontuação</span>
          <span id="modalScore" class="text-base font-extrabold text-amber-300">0</span>
        </div>
      </div>

      <div id="modalActions" class="flex flex-col sm:flex-row gap-2.5 justify-center"></div>
    </div>
  </div>

<script>
/**
 * ============================================================================
 * MAHJONG BRASIL — EDIÇÃO VITA (SINGLE-FILE)
 * - Barra superior na ordem exata: Som -> Livres -> Peças -> Temas (Bíblia, Brasil, Clássico) -> Formatos
 * - 34 tipos únicos de peças com SVG vetorial nítido e combinação estrita (typeId === typeId)
 * - 5 tabuleiros verticais compactos (máx. 6 colunas): 48, 60, 72, 84 e 96 peças
 * - Gerador 100% solucionável + Embaralhamento com dispersão espacial
 * - Finalização automática em cascata (Auto-Finish) com escala pentatônica ascendente
 * ============================================================================
 */

/* ------------------------- 1. ÁUDIO PROCEDURAL (WEB AUDIO API) ------------------------- */
class SoundFX {
  constructor() {
    this.ctx = null;
    this.muted = false;
  }

  ensureCtx() {
    if (!this.ctx) {
      const AudioCtx = window.AudioContext || window.webkitAudioContext;
      if (AudioCtx) this.ctx = new AudioCtx();
    }
    if (this.ctx && this.ctx.state === 'suspended') {
      this.ctx.resume();
    }
  }

  // Toque tátil de madeira/marfim
  playClick() {
    if (this.muted) return;
    this.ensureCtx();
    if (!this.ctx) return;
    const t = this.ctx.currentTime;
    const osc = this.ctx.createOscillator();
    const gain = this.ctx.createGain();
    osc.type = 'triangle';
    osc.frequency.setValueAtTime(640, t);
    osc.frequency.exponentialRampToValueAtTime(210, t + 0.048);
    gain.gain.setValueAtTime(0.22, t);
    gain.gain.exponentialRampToValueAtTime(0.001, t + 0.052);
    osc.connect(gain);
    gain.connect(this.ctx.destination);
    osc.start(t);
    osc.stop(t + 0.055);
  }

  // Som grave abafado de bloqueio
  playBlocked() {
    if (this.muted) return;
    this.ensureCtx();
    if (!this.ctx) return;
    const t = this.ctx.currentTime;
    const osc = this.ctx.createOscillator();
    const gain = this.ctx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(135, t);
    osc.frequency.exponentialRampToValueAtTime(82, t + 0.11);
    gain.gain.setValueAtTime(0.24, t);
    gain.gain.exponentialRampToValueAtTime(0.001, t + 0.12);
    osc.connect(gain);
    gain.connect(this.ctx.destination);
    osc.start(t);
    osc.stop(t + 0.125);
  }

  // Combinação de par com pitch progressivo
  playMatch(combo = 1) {
    if (this.muted) return;
    this.ensureCtx();
    if (!this.ctx) return;
    const t = this.ctx.currentTime;
    const root = 523.25 * Math.pow(1.06, Math.min(combo - 1, 8));

    [root, root * 1.25, root * 1.5].forEach((freq, idx) => {
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.type = idx === 0 ? 'triangle' : 'sine';
      osc.frequency.setValueAtTime(freq, t + idx * 0.03);
      gain.gain.setValueAtTime(0.16 / (idx + 1), t + idx * 0.03);
      gain.gain.exponentialRampToValueAtTime(0.001, t + idx * 0.03 + 0.24);
      osc.connect(gain);
      gain.connect(this.ctx.destination);
      osc.start(t + idx * 0.03);
      osc.stop(t + idx * 0.03 + 0.26);
    });
  }

  // Escala pentatônica ascendente para a finalização automática
  playPentatonicStep(stepIndex = 0) {
    if (this.muted) return;
    this.ensureCtx();
    if (!this.ctx) return;
    const t = this.ctx.currentTime;
    const semitoneOffsets = [0, 2, 4, 7, 9];
    const octave = Math.floor(stepIndex / 5);
    const degree = semitoneOffsets[stepIndex % 5];
    const totalSemitones = Math.min(octave * 12 + degree, 28);
    const freq = 523.25 * Math.pow(2, totalSemitones / 12);

    const osc1 = this.ctx.createOscillator();
    const osc2 = this.ctx.createOscillator();
    const gain = this.ctx.createGain();

    osc1.type = 'triangle';
    osc2.type = 'sine';
    osc1.frequency.setValueAtTime(freq, t);
    osc2.frequency.setValueAtTime(freq * 2, t);

    gain.gain.setValueAtTime(0.19, t);
    gain.gain.exponentialRampToValueAtTime(0.001, t + 0.24);

    osc1.connect(gain);
    osc2.connect(gain);
    gain.connect(this.ctx.destination);

    osc1.start(t);
    osc2.start(t);
    osc1.stop(t + 0.25);
    osc2.stop(t + 0.25);
  }

  // Embaralhar
  playShuffle() {
    if (this.muted) return;
    this.ensureCtx();
    if (!this.ctx) return;
    const t = this.ctx.currentTime;
    for (let i = 0; i < 6; i++) {
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(290 + i * 70, t + i * 0.038);
      gain.gain.setValueAtTime(0.12, t + i * 0.038);
      gain.gain.exponentialRampToValueAtTime(0.001, t + i * 0.038 + 0.045);
      osc.connect(gain);
      gain.connect(this.ctx.destination);
      osc.start(t + i * 0.038);
      osc.stop(t + i * 0.038 + 0.05);
    }
  }

  // Fanfarra de vitória
  playVictory() {
    if (this.muted) return;
    this.ensureCtx();
    if (!this.ctx) return;
    const t = this.ctx.currentTime;
    const notes = [523.25, 659.25, 783.99, 1046.50, 783.99, 1046.50];
    notes.forEach((freq, idx) => {
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(freq, t + idx * 0.11);
      gain.gain.setValueAtTime(0.2, t + idx * 0.11);
      gain.gain.exponentialRampToValueAtTime(0.001, t + idx * 0.11 + 0.38);
      osc.connect(gain);
      gain.connect(this.ctx.destination);
      osc.start(t + idx * 0.11);
      osc.stop(t + idx * 0.11 + 0.4);
    });
  }
}

function getTileSVG(iconKey) {
  const drawCircles = (count) => {
    const coords = {
      1: [[50, 50, 28]],
      2: [[50, 30, 16], [50, 70, 16]],
      3: [[28, 28, 13], [50, 50, 13], [72, 72, 13]],
      4: [[32, 32, 14], [68, 32, 14], [32, 68, 14], [68, 68, 14]],
      5: [[28, 28, 12], [72, 28, 12], [50, 50, 12], [28, 72, 12], [72, 72, 12]],
      6: [[34, 24, 11], [66, 24, 11], [34, 50, 11], [66, 50, 11], [34, 76, 11], [66, 76, 11]],
      7: [[26, 22, 9], [50, 30, 9], [74, 38, 9], [34, 58, 9.5], [66, 58, 9.5], [34, 80, 9.5], [66, 80, 9.5]],
      8: [[34, 20, 9], [66, 20, 9], [34, 40, 9], [66, 40, 9], [34, 60, 9], [66, 60, 9], [34, 80, 9], [66, 80, 9]],
      9: [[26, 24, 9], [50, 24, 9], [74, 24, 9], [26, 50, 9], [50, 50, 9], [74, 50, 9], [26, 76, 9], [50, 76, 9], [74, 76, 9]]
    }[count] || [[50, 50, 22]];

    return coords.map(([cx, cy, r], i) => {
      const c = count === 1 ? '#dc2626' : (i % 2 === 0 ? '#1d4ed8' : '#15803d');
      return `<circle cx="${cx}" cy="${cy}" r="${r}" fill="${c}" stroke="#fff" stroke-width="2"/><circle cx="${cx}" cy="${cy}" r="${r * 0.45}" fill="none" stroke="#fff" stroke-width="2"/>`;
    }).join('');
  };

  const drawBamboos = (count) => {
    if (count === 1) {
      return `<path d="M24 66 Q45 24 76 34 Q60 55 72 76 Q48 66 24 66 Z" fill="#15803d"/><circle cx="62" cy="40" r="3.5" fill="#fff"/><path d="M74 36 L86 33 L75 42 Z" fill="#dc2626"/>`;
    }
    const cols = count <= 3 ? count : Math.ceil(count / 2);
    let sticks = '';
    for (let i = 0; i < count; i++) {
      const row = count <= 3 ? 0 : Math.floor(i / cols);
      const col = count <= 3 ? i : i % cols;
      const totalInRow = count <= 3 ? count : (row === 0 ? cols : count - cols);
      const x = 50 + (col - (totalInRow - 1) / 2) * 23;
      const y = count <= 3 ? 20 : (row === 0 ? 15 : 53);

/* ------------------------- 4. 5 LAYOUTS VERTICAIS COMPACTOS (48 A 96 PEÇAS, MÁX. 6 COLS) ------------------------- */
function createLayouts() {
  // 1. Desafio Rápido (48 peças, 3 camadas, 5 cols x 6 linhas)
  const desafio_rapido = [];
  for (let r = 0; r < 6; r++) for (let c = 0; c < 5; c++) desafio_rapido.push({ x: c, y: r, z: 0 });            // 30
  for (let r = 0; r < 4; r++) for (let c = 0; c < 3; c++) desafio_rapido.push({ x: 1 + c, y: 1 + r, z: 1 });    // 12
  for (let r = 0; r < 3; r++) for (let c = 0; c < 2; c++) desafio_rapido.push({ x: 1.5 + c, y: 1.5 + r, z: 2 });// 6 -> 48

  // 2. Pirâmide (60 peças, 5 camadas, 5 cols x 6 linhas)
  const piramide = [];
  for (let r = 0; r < 6; r++) for (let c = 0; c < 5; c++) piramide.push({ x: c, y: r, z: 0 });               // 30
  for (let r = 0; r < 4; r++) for (let c = 0; c < 4; c++) piramide.push({ x: 0.5 + c, y: 1 + r, z: 1 });     // 16
  for (let r = 0; r < 3; r++) for (let c = 0; c < 3; c++) piramide.push({ x: 1 + c, y: 1.5 + r, z: 2 });     // 9
  for (let r = 0; r < 2; r++) for (let c = 0; c < 2; c++) piramide.push({ x: 1.5 + c, y: 2 + r, z: 3 });     // 4
  piramide.push({ x: 2, y: 2.5, z: 4 });                                                                     // 1 -> 60

  // 3. Pão de Açúcar (72 peças, 4 camadas, 6 cols x 6 linhas)
  const pao_acucar = [];
  for (let r = 0; r < 6; r++) for (let c = 0; c < 6; c++) pao_acucar.push({ x: c, y: r, z: 0 });          // 36
  for (let r = 0; r < 4; r++) for (let c = 0; c < 5; c++) pao_acucar.push({ x: 0.5 + c, y: 1 + r, z: 1 });  // 20
  for (let r = 0; r < 3; r++) for (let c = 0; c < 4; c++) pao_acucar.push({ x: 1 + c, y: 1.5 + r, z: 2 });  // 12
  for (let r = 0; r < 2; r++) for (let c = 0; c < 2; c++) pao_acucar.push({ x: 2 + c, y: 2 + r, z: 3 });    // 4 -> 72

  // 4. Coroa (84 peças, 5 camadas, 6 cols x 7 linhas)
  const coroa = [];
  for (let r = 0; r < 7; r++) for (let c = 0; c < 6; c++) coroa.push({ x: c, y: r, z: 0 });               // 42
  for (let r = 0; r < 5; r++) for (let c = 0; c < 4; c++) coroa.push({ x: 1 + c, y: 1 + r, z: 1 });       // 20
  for (let r = 0; r < 4; r++) for (let c = 0; c < 3; c++) coroa.push({ x: 1.5 + c, y: 1.5 + r, z: 2 });   // 12
  for (let r = 0; r < 4; r++) for (let c = 0; c < 2; c++) coroa.push({ x: 2 + c, y: 1.5 + r, z: 3 });     // 8
  for (let r = 0; r < 2; r++) coroa.push({ x: 2.5, y: 2.5 + r, z: 4 });                                   // 2 -> 84

  // 5. Catedral (96 peças, 6 camadas, 6 cols x 7 linhas)
  const catedral = [];
  for (let r = 0; r < 7; r++) for (let c = 0; c < 6; c++) catedral.push({ x: c, y: r, z: 0 });            // 42
  for (let r = 0; r < 6; r++) for (let c = 0; c < 4; c++) catedral.push({ x: 1 + c, y: 0.5 + r, z: 1 });  // 24
  for (let r = 0; r < 5; r++) for (let c = 0; c < 3; c++) catedral.push({ x: 1.5 + c, y: 1 + r, z: 2 });  // 15
  for (let r = 0; r < 4; r++) for (let c = 0; c < 2; c++) catedral.push({ x: 2 + c, y: 1.5 + r, z: 3 });  // 8
  for (let r = 0; r < 2; r++) for (let c = 0; c < 2; c++) catedral.push({ x: 2 + c, y: 2.5 + r, z: 4 });  // 4
  for (let c = 0; c < 3; c++) catedral.push({ x: 1.5 + c, y: 3, z: 5 });                                  // 3 -> 96

  return { desafio_rapido, piramide, pao_acucar, coroa, catedral };
}

const LAYOUTS = createLayouts();

/* ------------------------- 5. REGRAS DE LIBERDADE E GERADOR SOLUCIONÁVEL ------------------------- */
function isTileFree(target, activeTiles) {
  let leftBlocked = false;
  let rightBlocked = false;

  for (let i = 0; i < activeTiles.length; i++) {
    const other = activeTiles[i];
    if (other.uid === target.uid || other.removed) continue;

    // Sobreposição na camada superior z + 1
    if (other.z === target.z + 1) {
      if (Math.abs(other.x - target.x) < 0.95 && Math.abs(other.y - target.y) < 0.95) {
        return false;
      }
    }

    // Bloqueio lateral esquerdo ou direito na mesma camada z
    if (other.z === target.z && Math.abs(other.y - target.y) < 0.95) {
      const dx = other.x - target.x;
      if (dx >= -1.05 && dx <= -0.5) leftBlocked = true;
      if (dx >= 0.5 && dx <= 1.05) rightBlocked = true;
    }
  }

  return !leftBlocked || !rightBlocked;
}

function canTilesMatch(a, b) {
  return Boolean(a && b && a.uid !== b.uid && a.typeId === b.typeId);
}

function buildPairPool(totalSlots) {
  const numPairs = totalSlots / 2;
  const pool = [];
  while (pool.length < numPairs) {
    const ids = TILE_TYPES.map(t => t.id);
    for (let i = ids.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [ids[i], ids[j]] = [ids[j], ids[i]];
    }
    pool.push(...ids);
  }
  return pool.slice(0, numPairs);
}

/**
 * Pontua dispersão espacial entre duas peças (a, b) e cópias prévias do mesmo tipo.
 * Penaliza fortemente pares adjacentes (distância < 2.2) ou empilhados na mesma coluna/linha.
 */
function scorePairDispersion(a, b, sameTypePositions = []) {
  const dx = Math.abs(a.x - b.x);
  const dy = Math.abs(a.y - b.y);
  const dz = Math.abs(a.z - b.z);
  const euclid = Math.hypot(dx, dy);
  const manhattan = dx + dy;

  let score = euclid * 14 + manhattan * 6;

  // Penalidade severa para empilhamento na mesma coluna/linha
  if (dx < 0.6 && dy < 0.6) {
    score -= 190;
  } else if (dx < 0.4 || dy < 0.4) {
    score -= 35;
  }

  // Penalidade forte para peças adjacentes ou muito próximas (< 2.2 unidades)
  if (euclid < 2.2) {
    score -= (2.2 - euclid) * 65 + 45;
  }

  if (dx >= 2.0) score += 18;
  if (dy >= 2.0) score += 18;
  if (dz >= 1 && euclid >= 2.2) score += 12;

  for (let i = 0; i < sameTypePositions.length; i++) {
    const prev = sameTypePositions[i];
    const d1 = Math.hypot(a.x - prev.x, a.y - prev.y);
    const d2 = Math.hypot(b.x - prev.x, b.y - prev.y);
    if (d1 < 1.5) score -= 50;
    if (d2 < 1.5) score -= 50;
    score += Math.min(d1, 5) * 2 + Math.min(d2, 5) * 2;
  }

  return score + (Math.random() - 0.5) * 14;
}

function pickDispersedFreePair(freeList, sameTypePositions = []) {
  if (freeList.length < 2) return null;
  if (freeList.length === 2) return [freeList[0], freeList[1]];

  const totalCandidates = Math.min(54, (freeList.length * (freeList.length - 1)) / 2);
  let bestPair = null;
  let bestScore = -Infinity;

  for (let c = 0; c < totalCandidates; c++) {
    const idx1 = Math.floor(Math.random() * freeList.length);
    let idx2 = Math.floor(Math.random() * (freeList.length - 1));
    if (idx2 >= idx1) idx2++;

    const a = freeList[idx1];
    const b = freeList[idx2];
    const s = scorePairDispersion(a, b, sameTypePositions);
    if (s > bestScore) {
      bestScore = s;
      bestPair = [a, b];
    }
  }

  return bestPair;
}

function generateSolvableBoard(coords) {
  const pairTypes = buildPairPool(coords.length);
  let bestBoard = null;
  let bestBoardGlobalScore = -Infinity;

  for (let attempt = 0; attempt < 45; attempt++) {
    const sim = coords.map((pos, idx) => ({
      uid: idx,
      x: pos.x,
      y: pos.y,
      z: pos.z,
      typeId: -1,
      removed: false
    }));

    const assignedByType = new Map();
    const pairs = [];
    let ok = true;
    let totalDispersion = 0;

    for (let step = 0; step < pairTypes.length; step++) {
      const free = sim.filter(t => !t.removed && isTileFree(t, sim));
      if (free.length < 2) {
        ok = false;
        break;
      }

      const typeId = pairTypes[step];
      const existingOfType = assignedByType.get(typeId) || [];
      const [t1, t2] = pickDispersedFreePair(free, existingOfType);

      totalDispersion += scorePairDispersion(t1, t2, existingOfType);
      t1.removed = true;
      t2.removed = true;
      pairs.push([t1.uid, t2.uid, typeId]);
      assignedByType.set(typeId, [...existingOfType, { x: t1.x, y: t1.y, z: t1.z }, { x: t2.x, y: t2.y, z: t2.z }]);
    }

    if (ok && totalDispersion > bestBoardGlobalScore) {
      bestBoardGlobalScore = totalDispersion;
      const candidate = coords.map((pos, idx) => ({
        uid: idx,
        x: pos.x,
        y: pos.y,
        z: pos.z,
        typeId: 0,
        removed: false
      }));
      pairs.forEach(([u1, u2, typeId]) => {
        candidate[u1].typeId = typeId;
        candidate[u2].typeId = typeId;
      });
      bestBoard = candidate;
    }
  }

  if (bestBoard) return bestBoard;

  return coords.map((pos, idx) => ({
    uid: idx,
    x: pos.x,
    y: pos.y,
    z: pos.z,
    typeId: pairTypes[Math.floor(idx / 2)],
    removed: false
  }));
}

function renderTileFace(el, typeId, tileW) {

function layoutBoard(rebuildDOM = true) {
  if (state.tiles.length === 0) return;

  let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity, maxZ = 0;
  state.tiles.forEach(t => {
    minX = Math.min(minX, t.x);
    maxX = Math.max(maxX, t.x + 1.0);
    minY = Math.min(minY, t.y);
    maxY = Math.max(maxY, t.y + 1.0);
    maxZ = Math.max(maxZ, t.z);
  });

  const unitsW = maxX - minX;
  const unitsH = maxY - minY;

  const vp = boardViewport.getBoundingClientRect();
  const isMobile = vp.width < 640;

  const layerShiftRatioX = 0.06;
  const layerShiftRatioY = 0.075;
  const depthRatioX = 0.06;
  const depthRatioY = 0.095;

  const extraW = maxZ * layerShiftRatioX + depthRatioX;
  const extraH = (maxZ * layerShiftRatioY + depthRatioY) * (4 / 3);

  const availW = vp.width * (isMobile ? 0.95 : 0.90);
  const availH = vp.height * (isMobile ? 0.95 : 0.90);

  const maxWByWidth = availW / (unitsW + extraW);
  const maxWByHeight = (availH * 0.75) / (unitsH + extraH);

  const tileW = Math.floor(Math.min(maxWByWidth, maxWByHeight, 98));
  const tileH = Math.round(tileW * (4 / 3));

  const layerShiftX = Math.round(tileW * layerShiftRatioX);
  const layerShiftY = Math.round(tileH * layerShiftRatioY);
  const depthX = Math.max(3, Math.round(tileW * depthRatioX));
  const depthY = Math.max(6, Math.round(tileH * depthRatioY));
  const radius = Math.max(8, Math.round(tileW * 0.14));

  const containerW = Math.round(unitsW * tileW + maxZ * layerShiftX + depthX);
  const containerH = Math.round(unitsH * tileH + maxZ * layerShiftY + depthY);

  boardContainer.style.width = `${containerW}px`;
  boardContainer.style.height = `${containerH}px`;
  boardContainer.style.setProperty('--depth-x', `${depthX}px`);
  boardContainer.style.setProperty('--depth-y', `${depthY}px`);
  boardContainer.style.setProperty('--tile-radius', `${radius}px`);

  if (rebuildDOM) {
    boardContainer.innerHTML = '';
    tileElements.clear();
  }

  state.tiles.forEach(tile => {
    let el = tileElements.get(tile.uid);
    if (!el) {
      el = document.createElement('div');
      el.className = 'mj-tile';
      el.dataset.uid = tile.uid;

      const face = document.createElement('div');
      face.className = 'mj-tile-face';
      el.appendChild(face);

      el.addEventListener('click', () => onTileClick(tile.uid));
      boardContainer.appendChild(el);
      tileElements.set(tile.uid, el);
    }

    const left = Math.round((tile.x - minX) * tileW + (maxZ - tile.z) * layerShiftX);
    const top = Math.round((tile.y - minY) * tileH + (maxZ - tile.z) * layerShiftY);

    el.style.width = `${tileW}px`;
    el.style.height = `${tileH}px`;
    el.style.left = `${left}px`;
    el.style.top = `${top}px`;
    el.style.zIndex = Math.round(tile.z * 10000 + tile.y * 100 + tile.x * 10);

    renderTileFace(el, tile.typeId, tileW);
  });

  syncBoardStates();
}

window.addEventListener('resize', () => layoutBoard(false));

/* ------------------------- 8. FINALIZAÇÃO AUTOMÁTICA EM CASCATA (AUTO-FINISH) ------------------------- */
function cancelAutoFinish() {
  state.autoFinishTimers.forEach(id => clearTimeout(id));
  state.autoFinishTimers = [];
  state.isAutoFinishing = false;

  const badge = document.getElementById('autoFinishBadge');
  badge.classList.add('hidden');
  badge.classList.remove('flex');
}

function canTriggerAutoFinish() {
  if (state.isAutoFinishing) return false;
  const active = state.tiles.filter(t => !t.removed);
  if (active.length < 2 || active.length % 2 !== 0) return false;

  // 1. Todas as peças restantes devem estar livres simultaneamente
  for (let i = 0; i < active.length; i++) {
    if (!isTileFree(active[i], active)) return false;
  }

  // 2. Todas devem formar pares idênticos válidos
  const counts = new Map();
  for (let i = 0; i < active.length; i++) {
    const id = active[i].typeId;
    counts.set(id, (counts.get(id) || 0) + 1);
  }
  for (const cnt of counts.values()) {
    if (cnt % 2 !== 0) return false;
  }

  return true;
}

function startAutoFinish() {
  if (state.isAutoFinishing) return;
  state.isAutoFinishing = true;
  state.selectedUid = null;
  state.hintUids = [];

  const badge = document.getElementById('autoFinishBadge');
  badge.classList.remove('hidden');
  badge.classList.add('flex');

  document.getElementById('undoBtn').disabled = true;
  document.getElementById('hintBtn').disabled = true;
  document.getElementById('shuffleBtn').disabled = true;

  let stepIndex = 0;

  const processNextPair = () => {
    if (!state.isAutoFinishing) return;

    const pairs = getAvailablePairs();
    if (pairs.length === 0) {
      const remaining = state.tiles.filter(t => !t.removed);
      if (remaining.length === 0) {
        stopTimer();
        const winTimer = setTimeout(() => {
          if (!state.isAutoFinishing) return;
          cancelAutoFinish();
          sfx.playVictory();
          openVictoryModal();
        }, 280);
        state.autoFinishTimers.push(winTimer);
      } else {
        cancelAutoFinish();
        syncBoardStates();
      }
      return;
    }

    const [t1, t2] = pairs[0];
    const el1 = tileElements.get(t1.uid);
    const el2 = tileElements.get(t2.uid);

    if (el1) el1.classList.add('auto-highlight');
    if (el2) el2.classList.add('auto-highlight');

    const highlightTimer = setTimeout(() => {
      if (!state.isAutoFinishing) return;

      if (el1) {
        el1.classList.remove('auto-highlight');
        spawnGoldSparkles(el1);
        el1.classList.add('auto-removing');
      }
      if (el2) {
        el2.classList.remove('auto-highlight');
        spawnGoldSparkles(el2);
        el2.classList.add('auto-removing');
      }

      sfx.playPentatonicStep(stepIndex);
      stepIndex += 1;
      state.combo = Math.max(1, state.combo + 1);
      state.score += 100 * state.combo;

      t1.removed = true;
      t2.removed = true;

      const leftCount = state.tiles.filter(t => !t.removed).length;
      document.getElementById('remainingCount').textContent = leftCount;

      const hideTimer = setTimeout(() => {
        if (el1 && t1.removed) {
          el1.style.display = 'none';
          el1.classList.remove('auto-removing');
        }
        if (el2 && t2.removed) {
          el2.style.display = 'none';
          el2.classList.remove('auto-removing');
        }
      }, 240);
      state.autoFinishTimers.push(hideTimer);

      const nextStepTimer = setTimeout(processNextPair, 70);
      state.autoFinishTimers.push(nextStepTimer);
    }, 80);

    state.autoFinishTimers.push(highlightTimer);
  };

  const initialTimer = setTimeout(processNextPair, 120);
  state.autoFinishTimers.push(initialTimer);
}

/* ------------------------- 9. SINCRONIZAÇÃO DE ESTADOS ------------------------- */
function getAvailablePairs() {
  const active = state.tiles.filter(t => !t.removed);
  const free = active.filter(t => isTileFree(t, active));
  const pairs = [];
  for (let i = 0; i < free.length; i++) {
    for (let j = i + 1; j < free.length; j++) {
      if (canTilesMatch(free[i], free[j])) {
        pairs.push([free[i], free[j]]);
      }
    }
  }
  return pairs;
}

function syncBoardStates() {
  if (state.isAutoFinishing) return;

  const active = state.tiles.filter(t => !t.removed);
  const freeSet = new Set();
  active.forEach(t => {
    if (isTileFree(t, active)) freeSet.add(t.uid);
  });

  state.tiles.forEach(t => {
    const el = tileElements.get(t.uid);
    if (!el) return;

    if (t.removed) {
      if (!el.classList.contains('removing') && !el.classList.contains('auto-removing')) {
        el.style.display = 'none';
      }
      return;
    } else {
      el.style.display = 'block';
      el.classList.remove('removing', 'auto-removing', 'auto-highlight');
    }

    const isFree = freeSet.has(t.uid);
    el.classList.toggle('dim-blocked', state.highlightFree && !isFree);
    el.classList.toggle('selected', state.selectedUid === t.uid);
    el.classList.toggle('hinted', state.hintUids.includes(t.uid));
  });

  const pairs = getAvailablePairs();
  document.getElementById('remainingCount').textContent = active.length;
  document.getElementById('undoBtn').disabled = state.history.length === 0;
  document.getElementById('hintBtn').disabled = pairs.length === 0;
  document.getElementById('shuffleBtn').disabled = active.length < 2;

  if (active.length === 0) {
    stopTimer();
    sfx.playVictory();
    openVictoryModal();
  } else if (canTriggerAutoFinish()) {
    startAutoFinish();
  } else if (pairs.length === 0) {
    openNoMovesModal();
  }
}

function spawnSparkles(el) {
  if (!el) return;
  const rect = el.getBoundingClientRect();
  const vpRect = boardViewport.getBoundingClientRect();
  const cx = rect.left - vpRect.left + rect.width / 2;
  const cy = rect.top - vpRect.top + rect.height / 2;
  const colors = ['#facc15', '#34d399', '#38bdf8', '#fb923c'];

  for (let i = 0; i < 8; i++) {
    const dot = document.createElement('div');
    dot.className = 'sparkle-dot';
    const angle = (Math.PI * 2 * i) / 8;
    const dist = 28 + Math.random() * 18;
    dot.style.left = `${cx}px`;
    dot.style.top = `${cy}px`;
    dot.style.background = colors[i % colors.length];
    dot.style.setProperty('--dx', `${Math.cos(angle) * dist}px`);
    dot.style.setProperty('--dy', `${Math.sin(angle) * dist}px`);
    boardViewport.appendChild(dot);
    setTimeout(() => dot.remove(), 500);
  }
}

function onTileClick(uid) {
  if (state.isAutoFinishing) return;

  const tile = state.tiles.find(t => t.uid === uid);
  if (!tile || tile.removed) return;

  const active = state.tiles.filter(t => !t.removed);
  const el = tileElements.get(uid);

  if (!isTileFree(tile, active)) {
    sfx.playBlocked();
    el.classList.remove('blocked-shake');
    void el.offsetWidth;
    el.classList.add('blocked-shake');
    setTimeout(() => el.classList.remove('blocked-shake'), 170);
    return;
  }

  state.hintUids = [];

  if (state.selectedUid === uid) {
    sfx.playClick();
    state.selectedUid = null;
    syncBoardStates();
    return;
  }

  if (state.selectedUid === null) {
    sfx.playClick();
    state.selectedUid = uid;
    syncBoardStates();
    return;
  }

  const prevTile = state.tiles.find(t => t.uid === state.selectedUid);
  if (canTilesMatch(prevTile, tile)) {
    const now = Date.now();
    state.combo = (now - state.lastMatchTime < 4500) ? state.combo + 1 : 1;
    state.lastMatchTime = now;

    const gained = 100 * state.combo;
    state.score += gained;
    if (state.combo >= 2) {
      showToast(`Combo x${state.combo}! +${gained}`);
    }

    sfx.playMatch(state.combo);

    const prevEl = tileElements.get(prevTile.uid);
    spawnSparkles(prevEl);
    spawnSparkles(el);

    prevTile.removed = true;
    tile.removed = true;
    state.selectedUid = null;

    state.history.push({ uid1: prevTile.uid, uid2: tile.uid, scoreDelta: gained });

    prevEl.classList.remove('selected', 'hinted');
    el.classList.remove('selected', 'hinted');
    prevEl.classList.add('removing');
    el.classList.add('removing');

    syncBoardStates();

    setTimeout(() => {
      if (prevTile.removed) {
        prevEl.style.display = 'none';
        prevEl.classList.remove('removing');
      }
      if (tile.removed) {
        el.style.display = 'none';
        el.classList.remove('removing');
      }
    }, 180);
  } else {
    sfx.playClick();
    state.selectedUid = uid;
    syncBoardStates();
  }
}

/* ------------------------- 11. ASSISTENTES ------------------------- */
function undoMove() {
  if (state.isAutoFinishing || state.history.length === 0) return;
  closeModal();
  sfx.playClick();
  const last = state.history.pop();
  const t1 = state.tiles.find(t => t.uid === last.uid1);
  const t2 = state.tiles.find(t => t.uid === last.uid2);
  if (t1) t1.removed = false;
  if (t2) t2.removed = false;
  state.score = Math.max(0, state.score - last.scoreDelta);
  state.combo = 0;
  state.selectedUid = null;
  state.hintUids = [];
  syncBoardStates();
}

function triggerHint() {
  if (state.isAutoFinishing) return;
  const pairs = getAvailablePairs();
  if (pairs.length === 0) return;
  sfx.playClick();
  const chosen = pairs[0];
  state.selectedUid = null;
  state.hintUids = [chosen[0].uid, chosen[1].uid];
  syncBoardStates();
}

function shuffleRemaining() {
  if (state.isAutoFinishing) return;
  const active = state.tiles.filter(t => !t.removed);
  if (active.length < 2) return;

  closeModal();
  sfx.playShuffle();

  const countByType = new Map();
  active.forEach(t => countByType.set(t.typeId, (countByType.get(t.typeId) || 0) + 1));

  const remainingPairTypes = [];
  countByType.forEach((cnt, typeId) => {
    for (let k = 0; k < Math.floor(cnt / 2); k++) {
      remainingPairTypes.push(typeId);
    }
  });

  for (let i = remainingPairTypes.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [remainingPairTypes[i], remainingPairTypes[j]] = [remainingPairTypes[j], remainingPairTypes[i]];
  }

  let appliedSolvable = false;
  for (let attempt = 0; attempt < 35; attempt++) {
    const sim = active.map(t => ({
      uid: t.uid,
      x: t.x,
      y: t.y,
      z: t.z,
      removed: false
    }));

    const assignedByType = new Map();
    const assignments = [];
    let ok = true;

    for (let step = 0; step < remainingPairTypes.length; step++) {
      const free = sim.filter(t => !t.removed && isTileFree(t, sim));
      if (free.length < 2) {
        ok = false;
        break;
      }
      const typeId = remainingPairTypes[step];
      const existingOfType = assignedByType.get(typeId) || [];
      const [t1, t2] = pickDispersedFreePair(free, existingOfType);
      t1.removed = true;
      t2.removed = true;
      assignments.push([t1.uid, t2.uid, typeId]);
      assignedByType.set(typeId, [...existingOfType, { x: t1.x, y: t1.y, z: t1.z }, { x: t2.x, y: t2.y, z: t2.z }]);
    }

    if (ok) {
      const byUid = new Map(active.map(t => [t.uid, t]));
      assignments.forEach(([u1, u2, typeId]) => {
        byUid.get(u1).typeId = typeId;
        byUid.get(u2).typeId = typeId;
      });
      appliedSolvable = true;
      break;
    }
  }

  if (!appliedSolvable) {
    let bestTypes = active.map(t => t.typeId);
    let bestScore = -Infinity;

    for (let attempt = 0; attempt < 80; attempt++) {
      const candidate = [...bestTypes];
      for (let i = candidate.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [candidate[i], candidate[j]] = [candidate[j], candidate[i]];
      }

      let validPairs = 0;
      for (let i = 0; i < active.length; i++) {
        for (let j = i + 1; j < active.length; j++) {
          if (candidate[i] === candidate[j] && isTileFree(active[i], active) && isTileFree(active[j], active)) {
            validPairs++;
          }
        }
      }
      if (validPairs === 0) continue;

      let score = validPairs * 10;
      for (let i = 0; i < active.length; i++) {
        for (let j = i + 1; j < active.length; j++) {
          if (candidate[i] === candidate[j]) {
            score += scorePairDispersion(active[i], active[j]);
          }
        }
      }

      if (score > bestScore) {
        bestScore = score;
        bestTypes = candidate;
      }
    }

    active.forEach((tile, idx) => {
      tile.typeId = bestTypes[idx];
    });
  }

  const currentTileW = parseFloat(boardContainer.firstChild?.style.width) || 64;
  active.forEach(tile => {
    const el = tileElements.get(tile.uid);
    if (el) renderTileFace(el, tile.typeId, currentTileW);
  });

  state.selectedUid = null;
  state.hintUids = [];
  state.combo = 0;
  showToast('Peças embaralhadas!');
  syncBoardStates();
}

/* ------------------------- 12. TEMPORIZADOR E MODAIS ------------------------- */
function formatSeconds(s) {
  const m = String(Math.floor(s / 60)).padStart(2, '0');
  const sec = String(s % 60).padStart(2, '0');
  return `${m}:${sec}`;
}

function startTimer() {
  stopTimer();
  state.elapsedSeconds = 0;
  state.timerInterval = setInterval(() => {
    state.elapsedSeconds += 1;
  }, 1000);
}

function stopTimer() {
  if (state.timerInterval) {
    clearInterval(state.timerInterval);
    state.timerInterval = null;
  }
}

function closeModal() {
  const modal = document.getElementById('gameModal');
  modal.classList.add('hidden');
  modal.classList.remove('flex');
}

function openVictoryModal() {
  document.getElementById('modalIcon').textContent = '🏆';
  document.getElementById('modalTitle').textContent = 'Tabuleiro Concluído!';
  document.getElementById('modalDesc').textContent = 'Todas as peças foram combinadas com sucesso.';
  document.getElementById('modalStats').classList.remove('hidden');
  document.getElementById('modalTime').textContent = formatSeconds(state.elapsedSeconds);
  document.getElementById('modalScore').textContent = state.score;

  const actions = document.getElementById('modalActions');
  actions.innerHTML = `
    <button id="playAgainBtn" class="px-6 py-3 rounded-2xl bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-extrabold text-sm shadow-lg cursor-pointer">
      Novo Jogo
    </button>
  `;
  document.getElementById('playAgainBtn').addEventListener('click', () => {
    closeModal();
    startNewGame();
  });

  const modal = document.getElementById('gameModal');
  modal.classList.remove('hidden');
  modal.classList.add('flex');
}

function openNoMovesModal() {
  document.getElementById('modalIcon').textContent = '🔄';
  document.getElementById('modalTitle').textContent = 'Sem Movimentos Válidos';
  document.getElementById('modalDesc').textContent = 'Não há pares livres no momento. Deseja embaralhar as peças restantes?';
  document.getElementById('modalStats').classList.add('hidden');

  const actions = document.getElementById('modalActions');
  actions.innerHTML = `
    <button id="modalShuffleBtn" class="px-5 py-3 rounded-2xl bg-amber-400 hover:bg-amber-300 text-slate-950 font-extrabold text-sm shadow-lg cursor-pointer">
      Embaralhar Peças
    </button>
    ${state.history.length > 0 ? `
      <button id="modalUndoBtn" class="px-5 py-3 rounded-2xl bg-slate-700 hover:bg-slate-600 text-white font-bold text-sm cursor-pointer">
        Desfazer
      </button>
    ` : ''}
  `;
  document.getElementById('modalShuffleBtn').addEventListener('click', shuffleRemaining);
  const uBtn = document.getElementById('modalUndoBtn');
  if (uBtn) uBtn.addEventListener('click', undoMove);

  const modal = document.getElementById('gameModal');
  modal.classList.remove('hidden');
  modal.classList.add('flex');
}

function openConfirmRestartModal() {
  if (state.isAutoFinishing || state.history.length === 0) {
    startNewGame();
    return;
  }

  document.getElementById('modalIcon').textContent = '🔁';
  document.getElementById('modalTitle').textContent = 'Iniciar Novo Jogo?';
  document.getElementById('modalDesc').textContent = 'O progresso atual do tabuleiro será perdido e uma nova partida será gerada.';
  document.getElementById('modalStats').classList.add('hidden');

  const actions = document.getElementById('modalActions');
  actions.innerHTML = `
    <button id="confirmRestartBtn" class="px-5 py-3 rounded-2xl bg-amber-400 hover:bg-amber-300 text-slate-950 font-extrabold text-sm shadow-lg cursor-pointer">
      Sim, Novo Jogo
    </button>
    <button id="cancelRestartBtn" class="px-5 py-3 rounded-2xl bg-slate-700 hover:bg-slate-600 text-white font-bold text-sm cursor-pointer">
      Continuar Jogando
    </button>
  `;
  document.getElementById('confirmRestartBtn').addEventListener('click', () => {
    closeModal();
    startNewGame();
  });
  document.getElementById('cancelRestartBtn').addEventListener('click', () => {
    sfx.playClick();
    closeModal();
  });

  const modal = document.getElementById('gameModal');
  modal.classList.remove('hidden');
  modal.classList.add('flex');
}

/* ------------------------- 13. INICIALIZAÇÃO ------------------------- */
function startNewGame() {
  cancelAutoFinish();
  closeModal();
  state.selectedUid = null;
  state.hintUids = [];
  state.history = [];
  state.score = 0;
  state.combo = 0;

  const coords = LAYOUTS[state.layout] || LAYOUTS.pao_acucar;
  state.tiles = generateSolvableBoard(coords);

  applyThemePalette();
  layoutBoard(true);
  startTimer();
}

function changeTheme(newTheme) {
  if (state.theme === newTheme) return;
  state.theme = newTheme;
  savePrefs();
  applyThemePalette();

  const currentTileW = parseFloat(boardContainer.firstChild?.style.width) || 64;
  state.tiles.forEach(tile => {
    const el = tileElements.get(tile.uid);
    if (el) renderTileFace(el, tile.typeId, currentTileW);
  });
  sfx.playClick();
}

document.querySelectorAll('.theme-btn').forEach(btn => {
  btn.addEventListener('click', () => changeTheme(btn.dataset.theme));
});

const layoutSelect = document.getElementById('layoutSelect');
layoutSelect.addEventListener('change', (e) => {
  cancelAutoFinish();
  state.layout = e.target.value;
  savePrefs();
  startNewGame();
});

document.getElementById('toggleFreeBtn').addEventListener('click', () => {
  state.highlightFree = !state.highlightFree;
  savePrefs();
  updateFreeToggleUI();
  syncBoardStates();
  sfx.playClick();
});

document.getElementById('undoBtn').addEventListener('click', undoMove);
document.getElementById('hintBtn').addEventListener('click', triggerHint);
document.getElementById('shuffleBtn').addEventListener('click', shuffleRemaining);
document.getElementById('newGameBtn').addEventListener('click', () => {
  sfx.playClick();
  openConfirmRestartModal();
});

document.getElementById('soundBtn').addEventListener('click', () => {
  sfx.muted = !sfx.muted;
  savePrefs();
  updateSoundUI();
  if (!sfx.muted) sfx.playClick();
});

window.addEventListener('DOMContentLoaded', () => {
  loadPrefs();
  layoutSelect.value = state.layout;
  updateFreeToggleUI();
  updateSoundUI();
  startNewGame();
});
</script>
