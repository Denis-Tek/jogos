<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Snake - Jogo da Cobrinha</title>
    <!-- Tailwind CSS para estrutura responsiva e utilitários -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Inter (Moderno) e Press Start 2P (Retrô Nokia 3310) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Press+Start+2P&display=swap" rel="stylesheet">

    <style>
        /* ==========================================================================
           VARIÁVEIS DE TEMA E ESTILOS BASE
           ========================================================================== */
        :root {
            --bg-app: #0f172a;
            --bg-panel: #1e293b;
            --border-panel: #334155;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --accent: #10b981;
            --accent-hover: #059669;
            --canvas-bg: #0b1120;
            --canvas-border: #334155;
            --btn-bg: #334155;
            --btn-text: #f8fafc;
            --font-main: 'Inter', system-ui, -apple-system, sans-serif;
            --radius: 0.75rem;
            --shadow-glow: 0 0 25px rgba(16, 185, 129, 0.2);
        }

        /* Tema Clássico Nokia 3310 (LCD Monocromático) */
        body.theme-nokia {
            --bg-app: #262b26;
            --bg-panel: #8bac0f;
            --border-panel: #0f380f;
            --text-primary: #0f380f;
            --text-secondary: #306230;
            --accent: #0f380f;
            --accent-hover: #306230;
            --canvas-bg: #9bbc0f;
            --canvas-border: #0f380f;
            --btn-bg: #8bac0f;
            --btn-text: #0f380f;
            --font-main: 'Press Start 2P', monospace;
            --radius: 2px;
            --shadow-glow: inset 0 0 18px rgba(15, 56, 15, 0.35);
        }

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100dvh;
            overflow: hidden; /* Zero-scroll obrigatório */
            background-color: var(--bg-app);
            color: var(--text-primary);
            font-family: var(--font-main);
            transition: background-color 0.25s ease, color 0.25s ease;
        }

        /* Ajustes tipográficos específicos para fonte pixelada no modo Nokia */
        body.theme-nokia {
            font-size: 11px;
            letter-spacing: -0.5px;
        }

        /* ==========================================================================
           CONTAINER DO CANVAS E EFEITOS VISUAIS
           ========================================================================== */
        .game-shell {
            background-color: var(--bg-panel);
            border: 2px solid var(--border-panel);
            border-radius: var(--radius);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.45);
            transition: all 0.25s ease;
        }

        body.theme-nokia .game-shell {
            border-width: 4px;
            box-shadow: 0 12px 0 #141714, 0 18px 30px rgba(0, 0, 0, 0.6);
        }

        .canvas-wrapper {
            position: relative;
            background-color: var(--canvas-bg);
            border: 2px solid var(--canvas-border);
            border-radius: calc(var(--radius) * 0.75);
            box-shadow: var(--shadow-glow);
            overflow: hidden;
            touch-action: none; /* Evita gestos nativos de pull-to-refresh durante swipe */
        }

        body.theme-nokia .canvas-wrapper {
            border-width: 4px;
        }

        /* Efeito sutil de matriz LCD no modo Nokia */
        body.theme-nokia .canvas-wrapper::after {
            content: "";
            position: absolute;
            inset: 0;
            background-image: 
                linear-gradient(rgba(15, 56, 15, 0.08) 1px, transparent 1px),
                linear-gradient(90deg, rgba(15, 56, 15, 0.08) 1px, transparent 1px);
            background-size: 4px 4px;
            pointer-events: none;
            z-index: 5;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        /* ==========================================================================
           BOTÕES E CONTROLES INTERATIVOS
           ========================================================================== */
        .ui-btn {
            background-color: var(--btn-bg);
            color: var(--btn-text);
            border: 1.5px solid var(--border-panel);
            border-radius: calc(var(--radius) * 0.75);
            transition: transform 0.1s ease, filter 0.15s ease, background-color 0.2s ease;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.35rem;
        }

        .ui-btn:hover {
            filter: brightness(1.1);
        }

        .ui-btn:active {
            transform: scale(0.95);
        }

        body.theme-nokia .ui-btn {
            border-width: 2px;
            box-shadow: 2px 2px 0 #0f380f;
        }

        body.theme-nokia .ui-btn:active {
            box-shadow: 0 0 0 #0f380f;
            transform: translate(2px, 2px);
        }

        .primary-btn {
            background-color: var(--accent);
            color: #ffffff;
            border-color: transparent;
            font-weight: 700;
        }

        body.theme-nokia .primary-btn {
            background-color: #0f380f;
            color: #9bbc0f;
            border-color: #0f380f;
        }

        /* Selects estilizados */
        .ui-select {
            background-color: var(--btn-bg);
            color: var(--btn-text);
            border: 1.5px solid var(--border-panel);
            border-radius: calc(var(--radius) * 0.75);
            font-family: inherit;
            font-size: inherit;
            outline: none;
            cursor: pointer;
        }

        body.theme-nokia .ui-select {
            border-width: 2px;
        }

        /* D-Pad Tátil Mobile */
        .dpad-btn {
            background-color: var(--btn-bg);
            color: var(--btn-text);
            border: 2px solid var(--border-panel);
            border-radius: var(--radius);
            box-shadow: 0 4px 0 rgba(0, 0, 0, 0.35);
            transition: transform 0.08s ease, box-shadow 0.08s ease;
            touch-action: manipulation;
        }

        .dpad-btn:active, .dpad-btn.pressed {
            transform: translateY(3px);
            box-shadow: 0 1px 0 rgba(0, 0, 0, 0.35);
            background-color: var(--accent);
            color: #ffffff;
        }

        body.theme-nokia .dpad-btn:active, body.theme-nokia .dpad-btn.pressed {
            background-color: #0f380f;
            color: #9bbc0f;
        }

        /* Overlays (Início, Pausa, Game Over) */
        .overlay-backdrop {
            background: rgba(11, 17, 32, 0.82);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            z-index: 20;
        }

        body.theme-nokia .overlay-backdrop {
            background: rgba(155, 188, 15, 0.90);
            backdrop-filter: none;
        }

        /* Animação de pulso suave */
        @keyframes pulseScale {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.04); }
        }
        .animate-pulse-slow {
            animation: pulseScale 2s infinite ease-in-out;
        }
    </style>
</head>
<body class="flex flex-col items-center justify-between p-2 sm:p-4">

    <header class="w-full max-w-2xl game-shell px-3 py-2 sm:px-4 sm:py-2.5 flex flex-wrap items-center justify-between gap-2 shrink-0">

        <!-- Controles Rápidos (Tema, Áudio, Pausa) -->
        <div class="flex items-center gap-1.5 sm:gap-2">

            <button id="soundToggleBtn" class="ui-btn p-1.5 sm:p-2" title="Ativar/Desativar Som" aria-label="Som">

                    <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>

                    <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
                    <line x1="23" y1="9" x2="17" y2="15"></line>

            <button id="pauseBtn" class="ui-btn p-1.5 sm:p-2" title="Pausar / Continuar (Espaço ou P)" aria-label="Pausar">
                <svg id="iconPause" class="w-4 h-4 sm:w-5 sm:h-5" viewBox="0 0 24 24" fill="currentColor">
                    <rect x="6" y="4" width="4" height="16" rx="1"></rect>

    <!-- ======================================================================
         BARRA DE CONFIGURAÇÕES DA PARTIDA (MODO E VELOCIDADE)

                        <path d="M18 6H6a2 2 0 0 0-2 2v2a2 2 0 0 0 2 2h12a2 2 0 0 1 2 2v2a2 2 0 0 1-2 2H6"/>

                </div>

                    <div class="flex flex-col">
                        <span class="text-[10px] uppercase opacity-70">Pontuação</span>

                    </div>

                        <span class="text-[10px] uppercase opacity-70">Tamanho</span>

                </div>

    <!-- ======================================================================
         CONTROLES TÁTEIS MOBILE (D-PAD)
         ====================================================================== -->
    <footer id="dpadContainer" class="w-full max-w-xs py-1 shrink-0 flex flex-col items-center justify-center">
        <div class="grid grid-cols-3 gap-2 w-44 sm:w-48">
            <div></div>
            <button class="dpad-btn h-12 flex items-center justify-center" data-dir="UP" aria-label="Cima">
                <svg class="w-6 h-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="18 15 12 9 6 15"></polyline></svg>

            <button class="dpad-btn h-12 flex items-center justify-center" data-dir="LEFT" aria-label="Esquerda">
                <svg class="w-6 h-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>
            </button>
            <button class="dpad-btn h-12 flex items-center justify-center" data-dir="DOWN" aria-label="Baixo">
                <svg class="w-6 h-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>
            </button>
            <button class="dpad-btn h-12 flex items-center justify-center" data-dir="RIGHT" aria-label="Direita">
                <svg class="w-6 h-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>

    </footer>

    <!-- ======================================================================
         LÓGICA DO JOGO (MOTOR, ÁUDIO WEB AUDIO API, RENDERIZAÇÃO E CONTROLES)
         ====================================================================== -->
    <script>
        /**
         * SINTETIZADOR DE ÁUDIO RETRÔ / MODERNO (Web Audio API - Zero dependências externas)
         */
        class SoundEngine {
            constructor() {
                this.ctx = null;
                this.muted = localStorage.getItem('snake_muted') === 'true';
            }

            init() {
                if (!this.ctx) {
                    const AudioContext = window.AudioContext || window.webkitAudioContext;
                    if (AudioContext) {
                        this.ctx = new AudioContext();
                    }
                }
                if (this.ctx && this.ctx.state === 'suspended') {
                    this.ctx.resume();
                }
            }

            toggleMute() {
                this.muted = !this.muted;
                localStorage.setItem('snake_muted', this.muted);
                return this.muted;
            }

            playTone(freq, type, duration, vol = 0.12, slideTo = null) {
                if (this.muted) return;
                this.init();
                if (!this.ctx) return;

                const now = this.ctx.currentTime;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();

                osc.type = type;
                osc.frequency.setValueAtTime(freq, now);
                if (slideTo) {
                    osc.frequency.exponentialRampToValueAtTime(slideTo, now + duration);
                }

                gain.gain.setValueAtTime(vol, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + duration);

                osc.connect(gain);
                gain.connect(this.ctx.destination);

                osc.start(now);
                osc.stop(now + duration);
            }

            playMove(isNokia) {
                if (isNokia) {
                    this.playTone(180, 'square', 0.03, 0.03);
                } else {
                    this.playTone(240, 'sine', 0.035, 0.03, 300);
                }
            }

            playEat(isNokia) {
                if (isNokia) {
                    this.playTone(520, 'square', 0.06, 0.1);
                    setTimeout(() => this.playTone(780, 'square', 0.09, 0.1), 55);
                } else {
                    this.playTone(440, 'triangle', 0.08, 0.14, 880);
                }
            }

            playBonus(isNokia) {
                const wave = isNokia ? 'square' : 'triangle';
                this.playTone(523.25, wave, 0.07, 0.12); // C5
                setTimeout(() => this.playTone(659.25, wave, 0.07, 0.12), 65); // E5
                setTimeout(() => this.playTone(783.99, wave, 0.07, 0.12), 130); // G5
                setTimeout(() => this.playTone(1046.50, wave, 0.16, 0.15), 195); // C6
            }

            playGameOver(isNokia) {
                const wave = isNokia ? 'square' : 'sawtooth';
                this.playTone(300, wave, 0.15, 0.14, 220);
                setTimeout(() => this.playTone(220, wave, 0.15, 0.14, 160), 140);
                setTimeout(() => this.playTone(150, wave, 0.35, 0.16, 70), 280);
            }
        }

        /**
         * CONFIGURAÇÕES E CONSTANTES DO JOGO
         */
        const GRID_SIZE = 21; // Grade 21x21 (ímpar para centro exato)
        const SPEED_CONFIG = {
            slow:   { baseInterval: 155, minInterval: 85, step: 1.5 },
            normal: { baseInterval: 115, minInterval: 60, step: 1.8 },
            fast:   { baseInterval: 80,  minInterval: 42, step: 2.0 }
        };

        const DIRECTIONS = {
            UP:    { x: 0, y: -1 },
            DOWN:  { x: 0, y: 1 },
            LEFT:  { x: -1, y: 0 },
            RIGHT: { x: 1, y: 0 }
        };

        /**
         * CONTROLADOR PRINCIPAL DO JOGO
         */
        class SnakeGame {
            constructor() {
                // Elementos DOM
                this.canvas = document.getElementById('gameCanvas');
                this.ctx = this.canvas.getContext('2d');
                this.canvasWrapper = document.getElementById('canvasWrapper');
                this.boardContainer = document.getElementById('boardContainer');

                // HUD e Overlays
                this.scoreDisplay = document.getElementById('scoreDisplay');
                this.highScoreDisplay = document.getElementById('highScoreDisplay');
                this.bonusHud = document.getElementById('bonusHud');
                this.bonusBarFill = document.getElementById('bonusBarFill');
                this.startOverlay = document.getElementById('startOverlay');
                this.pauseOverlay = document.getElementById('pauseOverlay');
                this.gameOverOverlay = document.getElementById('gameOverOverlay');
                this.finalScoreText = document.getElementById('finalScoreText');
                this.finalLengthText = document.getElementById('finalLengthText');
                this.deathReasonText = document.getElementById('deathReasonText');
                this.newRecordBadge = document.getElementById('newRecordBadge');

                // Botões e Seletores
                this.themeToggleBtn = document.getElementById('themeToggleBtn');
                this.themeLabel = document.getElementById('themeLabel');
                this.soundToggleBtn = document.getElementById('soundToggleBtn');
                this.iconSoundOn = document.getElementById('iconSoundOn');
                this.iconSoundOff = document.getElementById('iconSoundOff');
                this.pauseBtn = document.getElementById('pauseBtn');
                this.iconPause = document.getElementById('iconPause');
                this.iconPlay = document.getElementById('iconPlay');
                this.arenaModeSelect = document.getElementById('arenaModeSelect');
                this.speedSelect = document.getElementById('speedSelect');
                this.toggleDpadBtn = document.getElementById('toggleDpadBtn');
                this.dpadContainer = document.getElementById('dpadContainer');

                // Estado Persistente
                this.sound = new SoundEngine();
                this.theme = localStorage.getItem('snake_theme') || 'neon'; // 'neon' | 'nokia'
                this.highScore = parseInt(localStorage.getItem('snake_highscore') || '0', 10);
                this.arenaMode = localStorage.getItem('snake_arena') || 'walls';
                this.speedMode = localStorage.getItem('snake_speed') || 'normal';

                // Estado da Partida
                this.state = 'START'; // 'START' | 'PLAYING' | 'PAUSED' | 'GAMEOVER'
                this.snake = [];
                this.prevSnake = [];
                this.direction = DIRECTIONS.RIGHT;
                this.inputQueue = [];
                this.food = { x: 15, y: 10 };
                this.bonusFood = null; // { x, y, expiresAt, duration }
                this.foodsEatenCount = 0;
                this.score = 0;
                this.particles = [];

                // Controle de Loop
                this.lastFrameTime = 0;
                this.tickAccumulator = 0;
                this.currentTickInterval = SPEED_CONFIG.normal.baseInterval;
                this.cellSize = 20;

                // Inicialização
                this.applySavedPreferences();
                this.bindEvents();
                this.resetGameState();
                this.resizeCanvas();

                // Iniciar loop de renderização 60fps
                requestAnimationFrame((t) => this.loop(t));
            }

            applySavedPreferences() {
                // Tema
                if (this.theme === 'nokia') {
                    document.body.classList.add('theme-nokia');
                    this.themeLabel.textContent = 'Nokia 3310';
                } else {
                    document.body.classList.remove('theme-nokia');
                    this.themeLabel.textContent = 'Neon';
                }

                // Áudio
                this.updateSoundIcons();

                // Seletores
                this.arenaModeSelect.value = this.arenaMode;
                this.speedSelect.value = this.speedMode;
                this.highScoreDisplay.textContent = this.highScore;

                // D-Pad: visível por padrão em telas menores, opcional no desktop
                const savedDpad = localStorage.getItem('snake_dpad');
                if (savedDpad === 'hidden') {
                    this.dpadContainer.classList.add('hidden');
                } else if (savedDpad === 'visible') {
                    this.dpadContainer.classList.remove('hidden');
                } else if (window.innerWidth >= 768) {
                    this.dpadContainer.classList.add('hidden');
                }
            }

            updateSoundIcons() {
                if (this.sound.muted) {
                    this.iconSoundOn.classList.add('hidden');
                    this.iconSoundOff.classList.remove('hidden');
                } else {
                    this.iconSoundOn.classList.remove('hidden');
                    this.iconSoundOff.classList.add('hidden');
                }
            }

            resizeCanvas() {
                const containerRect = this.boardContainer.getBoundingClientRect();
                const availableSize = Math.floor(Math.min(containerRect.width, containerRect.height) - 8);
                // Garante múltiplo exato de GRID_SIZE para pixels nítidos
                const exactSize = Math.max(210, Math.floor(availableSize / GRID_SIZE) * GRID_SIZE);

                this.canvasWrapper.style.width = `${exactSize}px`;
                this.canvasWrapper.style.height = `${exactSize}px`;

                const dpr = window.devicePixelRatio || 1;
                this.canvas.width = exactSize * dpr;
                this.canvas.height = exactSize * dpr;
                this.ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

                this.cellSize = exactSize / GRID_SIZE;
            }

            resetGameState() {
                const mid = Math.floor(GRID_SIZE / 2);
                this.snake = [
                    { x: mid,     y: mid },
                    { x: mid - 1, y: mid },
                    { x: mid - 2, y: mid }
                ];
                this.prevSnake = this.snake.map(seg => ({ ...seg }));
                this.direction = DIRECTIONS.RIGHT;
                this.inputQueue = [];
                this.score = 0;
                this.foodsEatenCount = 0;
                this.bonusFood = null;
                this.particles = [];
                this.tickAccumulator = 0;

                const cfg = SPEED_CONFIG[this.speedMode];
                this.currentTickInterval = cfg.baseInterval;

                this.scoreDisplay.textContent = '0';
                this.bonusHud.classList.add('hidden');
                this.spawnFood();
            }

            startGame() {
                this.sound.init();
                this.resetGameState();
                this.state = 'PLAYING';
                this.startOverlay.classList.add('hidden');
                this.pauseOverlay.classList.add('hidden');
                this.gameOverOverlay.classList.add('hidden');
                this.updatePauseIcon();
                this.resizeCanvas();
            }

            togglePause() {
                if (this.state === 'PLAYING') {
                    this.state = 'PAUSED';
                    this.pauseOverlay.classList.remove('hidden');
                } else if (this.state === 'PAUSED') {
                    this.state = 'PLAYING';
                    this.pauseOverlay.classList.add('hidden');
                    this.lastFrameTime = performance.now();
                }
                this.updatePauseIcon();
            }

            updatePauseIcon() {
                if (this.state === 'PAUSED') {
                    this.iconPause.classList.add('hidden');
                    this.iconPlay.classList.remove('hidden');
                } else {
                    this.iconPause.classList.remove('hidden');
                    this.iconPlay.classList.add('hidden');
                }
            }

            queueDirection(newDirKey) {
                const newDir = DIRECTIONS[newDirKey];
                if (!newDir) return;

                // Determina a última direção planejada na fila (ou a direção atual)
                const lastPlannedDir = this.inputQueue.length > 0
                    ? this.inputQueue[this.inputQueue.length - 1]
                    : this.direction;

                // Evita direção oposta (180 graus) ou repetida
                if ((newDir.x + lastPlannedDir.x === 0 && newDir.y + lastPlannedDir.y === 0) ||
                    (newDir.x === lastPlannedDir.x && newDir.y === lastPlannedDir.y)) {
                    return;
                }

                // Limita fila a 2 comandos futuros para resposta instantânea sem lag
                if (this.inputQueue.length < 2) {
                    this.inputQueue.push(newDir);
                }
            }

            spawnFood() {
                let valid = false;
                let candidate = { x: 0, y: 0 };

                while (!valid) {
                    candidate.x = Math.floor(Math.random() * GRID_SIZE);
                    candidate.y = Math.floor(Math.random() * GRID_SIZE);

                    const onSnake = this.snake.some(s => s.x === candidate.x && s.y === candidate.y);
                    const onBonus = this.bonusFood && this.bonusFood.x === candidate.x && this.bonusFood.y === candidate.y;
                    if (!onSnake && !onBonus) {
                        valid = true;
                    }
                }
                this.food = candidate;
            }

            spawnBonusFood() {
                let valid = false;
                let candidate = { x: 0, y: 0 };
                let attempts = 0;

                while (!valid && attempts < 100) {
                    attempts++;
                    candidate.x = Math.floor(Math.random() * GRID_SIZE);
                    candidate.y = Math.floor(Math.random() * GRID_SIZE);

                    const onSnake = this.snake.some(s => s.x === candidate.x && s.y === candidate.y);
                    const onFood = this.food.x === candidate.x && this.food.y === candidate.y;
                    if (!onSnake && !onFood) {
                        valid = true;
                    }
                }

                if (valid) {
                    const duration = 7000; // 7 segundos para pegar o bônus
                    this.bonusFood = {
                        x: candidate.x,
                        y: candidate.y,
                        duration: duration,
                        expiresAt: performance.now() + duration
                    };
                    this.bonusHud.classList.remove('hidden');
                }
            }

            spawnParticles(gridX, gridY, color) {
                if (this.theme === 'nokia') return; // Nokia clássico não usa partículas modernas
                const cx = (gridX + 0.5) * this.cellSize;
                const cy = (gridY + 0.5) * this.cellSize;

                for (let i = 0; i < 14; i++) {
                    const angle = (Math.PI * 2 * i) / 14 + (Math.random() * 0.3);
                    const speed = 1.5 + Math.random() * 3.2;
                    this.particles.push({
                        x: cx,
                        y: cy,
                        vx: Math.cos(angle) * speed,
                        vy: Math.sin(angle) * speed,
                        life: 1.0,
                        decay: 0.03 + Math.random() * 0.025,
                        size: 2.5 + Math.random() * 2.5,
                        color: color
                    });
                }
            }

            stepLogic() {
                // Salva estado anterior para interpolação suave
                this.prevSnake = this.snake.map(seg => ({ ...seg }));

                // Consome próximo comando da fila
                if (this.inputQueue.length > 0) {
                    this.direction = this.inputQueue.shift();
                    this.sound.playMove(this.theme === 'nokia');
                }

                const head = this.snake[0];
                let nextX = head.x + this.direction.x;
                let nextY = head.y + this.direction.y;

                // Verificação de limites da arena
                if (this.arenaMode === 'walls') {
                    if (nextX < 0 || nextX >= GRID_SIZE || nextY < 0 || nextY >= GRID_SIZE) {
                        this.triggerGameOver('Você bateu na parede!');
                        return;
                    }
                } else {
                    // Modo Sem Paredes (Portal / Wrap-around)
                    nextX = (nextX + GRID_SIZE) % GRID_SIZE;
                    nextY = (nextY + GRID_SIZE) % GRID_SIZE;
                }

                // Verifica se vai comer comida neste tick
                const willEatFood = (nextX === this.food.x && nextY === this.food.y);
                const willEatBonus = (this.bonusFood && nextX === this.bonusFood.x && nextY === this.bonusFood.y);

                // Verifica colisão com o próprio corpo (ignora a ponta da cauda se não estiver crescendo)
                const bodyToCheck = willEatFood ? this.snake : this.snake.slice(0, -1);
                if (bodyToCheck.some(seg => seg.x === nextX && seg.y === nextY)) {
                    this.triggerGameOver('Você mordeu a própria cauda!');
                    return;
                }

                // Avança a cabeça
                this.snake.unshift({ x: nextX, y: nextY });

                // Trata coleta de comida normal
                if (willEatFood) {
                    this.score += 10;
                    this.foodsEatenCount++;
                    this.scoreDisplay.textContent = this.score;
                    this.sound.playEat(this.theme === 'nokia');
                    this.spawnParticles(nextX, nextY, '#f43f5e');
                    this.spawnFood();

                    // Aceleração progressiva suave
                    const cfg = SPEED_CONFIG[this.speedMode];
                    this.currentTickInterval = Math.max(cfg.minInterval, this.currentTickInterval - cfg.step);

                    // A cada 5 frutas normais, gera uma fruta bônus dourada
                    if (this.foodsEatenCount % 5 === 0 && !this.bonusFood) {
                        this.spawnBonusFood();
                    }
                } else {
                    // Remove a cauda se não comeu comida normal
                    this.snake.pop();
                }

                // Trata coleta de fruta bônus
                if (willEatBonus) {
                    this.score += 50;
                    this.scoreDisplay.textContent = this.score;
                    this.sound.playBonus(this.theme === 'nokia');
                    this.spawnParticles(nextX, nextY, '#fbbf24');
                    this.bonusFood = null;
                    this.bonusHud.classList.add('hidden');
                }
            }

            triggerGameOver(reason) {
                this.state = 'GAMEOVER';
                this.sound.playGameOver(this.theme === 'nokia');
                this.bonusFood = null;
                this.bonusHud.classList.add('hidden');

                let isNewRecord = false;
                if (this.score > this.highScore) {
                    this.highScore = this.score;
                    localStorage.setItem('snake_highscore', this.highScore);
                    this.highScoreDisplay.textContent = this.highScore;
                    isNewRecord = true;
                }

                this.deathReasonText.textContent = reason;
                this.finalScoreText.textContent = this.score;
                this.finalLengthText.textContent = this.snake.length;

                if (isNewRecord && this.score > 0) {
                    this.newRecordBadge.classList.remove('hidden');
                } else {
                    this.newRecordBadge.classList.add('hidden');
                }

                this.gameOverOverlay.classList.remove('hidden');
            }

            updateBonusTimer(now) {
                if (!this.bonusFood) return;
                const remaining = this.bonusFood.expiresAt - now;
                if (remaining <= 0) {
                    this.bonusFood = null;
                    this.bonusHud.classList.add('hidden');
                } else {
                    const pct = Math.max(0, (remaining / this.bonusFood.duration) * 100);
                    this.bonusBarFill.style.width = `${pct}%`;
                }
            }

            updateParticles() {
                for (let i = this.particles.length - 1; i >= 0; i--) {
                    const p = this.particles[i];
                    p.x += p.vx;
                    p.y += p.vy;
                    p.vx *= 0.94;
                    p.vy *= 0.94;
                    p.life -= p.decay;
                    if (p.life <= 0) {
                        this.particles.splice(i, 1);
                    }
                }
            }

            loop(now) {
                if (!this.lastFrameTime) this.lastFrameTime = now;
                const dt = Math.min(now - this.lastFrameTime, 100); // Trava delta máximo em 100ms
                this.lastFrameTime = now;

                if (this.state === 'PLAYING') {
                    this.tickAccumulator += dt;
                    while (this.tickAccumulator >= this.currentTickInterval) {
                        this.stepLogic();
                        this.tickAccumulator -= this.currentTickInterval;
                        if (this.state !== 'PLAYING') break;
                    }
                    this.updateBonusTimer(now);
                }

                this.updateParticles();

                // Fator de interpolação entre o tick anterior e o atual (0.0 a 1.0)
                const alpha = (this.state === 'PLAYING')
                    ? Math.min(1, this.tickAccumulator / this.currentTickInterval)
                    : 1;

                this.render(now, alpha);
                requestAnimationFrame((t) => this.loop(t));
            }

            render(now, alpha) {
                const isNokia = this.theme === 'nokia';
                const size = GRID_SIZE * this.cellSize;
                const cs = this.cellSize;

                // 1. Limpar Fundo
                this.ctx.clearRect(0, 0, size, size);

                if (isNokia) {
                    this.renderNokiaTheme(now, cs, size);
                } else {
                    this.renderNeonTheme(now, alpha, cs, size);
                }
            }

            /* ==================================================================
               RENDERIZADOR TEMA 1: NEON MODERNO
               ================================================================== */
            renderNeonTheme(now, alpha, cs, size) {
                const ctx = this.ctx;

                // Grade sutil de fundo
                ctx.strokeStyle = 'rgba(148, 163, 184, 0.06)';
                ctx.lineWidth = 1;
                for (let i = 1; i < GRID_SIZE; i++) {
                    const pos = i * cs;
                    ctx.beginPath();
                    ctx.moveTo(pos, 0);
                    ctx.lineTo(pos, size);
                    ctx.stroke();

                    ctx.beginPath();
                    ctx.moveTo(0, pos);
                    ctx.lineTo(size, pos);
                    ctx.stroke();
                }

                // Borda indicativa (sólida vs portal tracejado)
                if (this.arenaMode === 'portal') {
                    ctx.save();
                    ctx.strokeStyle = 'rgba(56, 189, 248, 0.45)';
                    ctx.lineWidth = 3;
                    ctx.setLineDash([8, 6]);
                    ctx.strokeRect(1.5, 1.5, size - 3, size - 3);
                    ctx.restore();
                }

                // Comida Normal (Maçã Rubi Pulsante)
                const pulse = 1 + Math.sin(now / 160) * 0.1;
                const fx = (this.food.x + 0.5) * cs;
                const fy = (this.food.y + 0.5) * cs;

                ctx.save();
                ctx.shadowColor = '#f43f5e';
                ctx.shadowBlur = 14;
                ctx.fillStyle = '#f43f5e';
                ctx.beginPath();
                ctx.arc(fx, fy, (cs * 0.36) * pulse, 0, Math.PI * 2);
                ctx.fill();

                // Brilho especular na fruta
                ctx.fillStyle = '#fda4af';
                ctx.beginPath();
                ctx.arc(fx - cs * 0.1, fy - cs * 0.1, cs * 0.1, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();

                // Fruta Bônus Dourada (Estrela / Diamante Giratório)
                if (this.bonusFood) {
                    const bx = (this.bonusFood.x + 0.5) * cs;
                    const by = (this.bonusFood.y + 0.5) * cs;
                    const rot = now / 300;

                    ctx.save();
                    ctx.translate(bx, by);
                    ctx.rotate(rot);
                    ctx.shadowColor = '#fbbf24';
                    ctx.shadowBlur = 18;
                    ctx.fillStyle = '#fbbf24';

                    const r = cs * 0.42;
                    ctx.beginPath();
                    ctx.moveTo(0, -r);
                    ctx.lineTo(r * 0.75, 0);
                    ctx.lineTo(0, r);
                    ctx.lineTo(-r * 0.75, 0);
                    ctx.closePath();
                    ctx.fill();
                    ctx.restore();
                }

                // Renderização da Cobra com Interpolação Suave
                const len = this.snake.length;
                for (let i = len - 1; i >= 0; i--) {
                    const curr = this.snake[i];
                    const prev = this.prevSnake[i] || curr;

                    // Evita interpolar através da tela quando atravessa portal
                    const wrapped = Math.abs(curr.x - prev.x) > 1 || Math.abs(curr.y - prev.y) > 1;
                    const interpX = wrapped ? curr.x : prev.x + (curr.x - prev.x) * alpha;
                    const interpY = wrapped ? curr.y : prev.y + (curr.y - prev.y) * alpha;

                    const cx = (interpX + 0.5) * cs;
                    const cy = (interpY + 0.5) * cs;

                    // Afinamento gradual da cauda
                    const ratio = i / Math.max(1, len);
                    const radius = (cs * 0.44) * (1 - ratio * 0.35);

                    ctx.save();
                    if (i === 0) {
                        ctx.shadowColor = '#10b981';
                        ctx.shadowBlur = 14;
                        ctx.fillStyle = '#34d399';
                    } else {
                        ctx.fillStyle = i % 2 === 0 ? '#10b981' : '#059669';
                    }

                    ctx.beginPath();
                    ctx.roundRect(cx - radius, cy - radius, radius * 2, radius * 2, radius * 0.65);
                    ctx.fill();
                    ctx.restore();

                    // Olhos expressivos na cabeça olhando para a comida
                    if (i === 0) {
                        this.drawSnakeEyes(ctx, cx, cy, radius);
                    }
                }

                // Partículas de explosão
                for (const p of this.particles) {
                    ctx.save();
                    ctx.globalAlpha = Math.max(0, p.life);
                    ctx.fillStyle = p.color;
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.restore();
                }
            }

            drawSnakeEyes(ctx, cx, cy, headRadius) {
                const eyeOffset = headRadius * 0.42;
                const eyeRadius = Math.max(2, headRadius * 0.24);
                const pupilRadius = eyeRadius * 0.52;

                // Posiciona olhos perpendicularmente à direção do movimento
                let e1x = cx, e1y = cy, e2x = cx, e2y = cy;
                const forward = headRadius * 0.25;

                if (this.direction === DIRECTIONS.RIGHT) {
                    e1x = cx + forward; e1y = cy - eyeOffset;
                    e2x = cx + forward; e2y = cy + eyeOffset;
                } else if (this.direction === DIRECTIONS.LEFT) {
                    e1x = cx - forward; e1y = cy - eyeOffset;
                    e2x = cx - forward; e2y = cy + eyeOffset;
                } else if (this.direction === DIRECTIONS.UP) {
                    e1x = cx - eyeOffset; e1y = cy - forward;
                    e2x = cx + eyeOffset; e2y = cy - forward;
                } else {
                    e1x = cx - eyeOffset; e1y = cy + forward;
                    e2x = cx + eyeOffset; e2y = cy + forward;
                }

                // Pupila olha sutilmente na direção da comida
                const target = this.bonusFood || this.food;
                const tx = (target.x + 0.5) * this.cellSize;
                const ty = (target.y + 0.5) * this.cellSize;
                const angle = Math.atan2(ty - cy, tx - cx);
                const lookDist = eyeRadius * 0.35;
                const px = Math.cos(angle) * lookDist;
                const py = Math.sin(angle) * lookDist;

                ctx.fillStyle = '#ffffff';
                ctx.beginPath();
                ctx.arc(e1x, e1y, eyeRadius, 0, Math.PI * 2);
                ctx.arc(e2x, e2y, eyeRadius, 0, Math.PI * 2);
                ctx.fill();

                ctx.fillStyle = '#0f172a';
                ctx.beginPath();
                ctx.arc(e1x + px, e1y + py, pupilRadius, 0, Math.PI * 2);
                ctx.arc(e2x + px, e2y + py, pupilRadius, 0, Math.PI * 2);
                ctx.fill();
            }

            /* ==================================================================
               RENDERIZADOR TEMA 2: NOKIA 3310 CLÁSSICO (LCD MONOCROMÁTICO)
               ================================================================== */
            renderNokiaTheme(now, cs, size) {
                const ctx = this.ctx;
                const darkPixel = '#0f380f';
                const midPixel = '#306230';
                const pad = Math.max(1.5, cs * 0.08);

                // Sombra fantasma sutil da grade LCD
                ctx.fillStyle = 'rgba(15, 56, 15, 0.05)';
                for (let x = 0; x < GRID_SIZE; x++) {
                    for (let y = 0; y < GRID_SIZE; y++) {
                        ctx.fillRect(x * cs + pad, y * cs + pad, cs - pad * 2, cs - pad * 2);
                    }
                }

                // Comida Normal (Formato clássico de cruz/pixel do Nokia)
                const fx = this.food.x * cs;
                const fy = this.food.y * cs;
                const p3 = cs / 3;
                ctx.fillStyle = darkPixel;
                ctx.fillRect(fx + p3, fy + 1, p3, cs - 2);
                ctx.fillRect(fx + 1, fy + p3, cs - 2, p3);

                // Fruta Bônus (Inseto/Bônus piscante retrô)
                if (this.bonusFood) {
                    const blink = Math.floor(now / 120) % 2 === 0;
                    ctx.fillStyle = blink ? darkPixel : midPixel;
                    const bx = this.bonusFood.x * cs;
                    const by = this.bonusFood.y * cs;
                    ctx.fillRect(bx + 2, by + 2, cs - 4, cs - 4);
                    ctx.clearRect(bx + p3, by + p3, p3, p3);
                }

                // Segmentos da Cobra em blocos sólidos monocromáticos
                this.snake.forEach((seg, index) => {
                    const sx = seg.x * cs;
                    const sy = seg.y * cs;
                    ctx.fillStyle = darkPixel;

                    if (index === 0) {
                        // Cabeça ligeiramente diferenciada
                        ctx.fillRect(sx + 1, sy + 1, cs - 2, cs - 2);
                        // Olho vazado (cor do fundo LCD)
                        ctx.fillStyle = '#9bbc0f';
                        ctx.fillRect(sx + cs * 0.35, sy + cs * 0.35, cs * 0.25, cs * 0.25);
                    } else {
                        ctx.fillRect(sx + pad, sy + pad, cs - pad * 2, cs - pad * 2);
                    }
                });
            }

            /* ==================================================================
               EVENTOS DE ENTRADA (TECLADO, SWIPE TOUCH, D-PAD E UI)
               ================================================================== */
            bindEvents() {
                // Redimensionamento responsivo
                window.addEventListener('resize', () => this.resizeCanvas());

                // Teclado
                window.addEventListener('keydown', (e) => {
                    const key = e.key.toLowerCase();

                    if (['arrowup', 'arrowdown', 'arrowleft', 'arrowright', ' '].includes(key)) {
                        e.preventDefault();
                    }

                    if (key === 'enter' || (key === ' ' && (this.state === 'START' || this.state === 'GAMEOVER'))) {
                        this.startGame();
                        return;
                    }

                    if (key === ' ' || key === 'p' || key === 'escape') {
                        if (this.state === 'PLAYING' || this.state === 'PAUSED') {
                            this.togglePause();
                        }
                        return;
                    }

                    if (this.state !== 'PLAYING') return;

                    if (key === 'arrowup' || key === 'w') this.queueDirection('UP');
                    else if (key === 'arrowdown' || key === 's') this.queueDirection('DOWN');
                    else if (key === 'arrowleft' || key === 'a') this.queueDirection('LEFT');
                    else if (key === 'arrowright' || key === 'd') this.queueDirection('RIGHT');
                });

                // Gestos Touch (Swipe) no Canvas
                let touchStartX = 0;
                let touchStartY = 0;

                this.canvasWrapper.addEventListener('touchstart', (e) => {
                    if (e.touches.length > 0) {
                        touchStartX = e.touches[0].clientX;
                        touchStartY = e.touches[0].clientY;
                    }
                }, { passive: true });

                this.canvasWrapper.addEventListener('touchmove', (e) => {
                    if (this.state !== 'PLAYING' || e.touches.length === 0) return;

                    const dx = e.touches[0].clientX - touchStartX;
                    const dy = e.touches[0].clientY - touchStartY;
                    const threshold = 24; // Sensibilidade do deslize em pixels

                    if (Math.abs(dx) > threshold || Math.abs(dy) > threshold) {
                        if (Math.abs(dx) > Math.abs(dy)) {
                            this.queueDirection(dx > 0 ? 'RIGHT' : 'LEFT');
                        } else {
                            this.queueDirection(dy > 0 ? 'DOWN' : 'UP');
                        }
                        // Atualiza ponto de referência para permitir curvas contínuas sem tirar o dedo
                        touchStartX = e.touches[0].clientX;
                        touchStartY = e.touches[0].clientY;
                    }
                }, { passive: true });

                // Botões D-Pad Táteis
                document.querySelectorAll('.dpad-btn').forEach(btn => {
                    const handleDir = (e) => {
                        e.preventDefault();
                        if (this.state === 'PLAYING') {
                            this.queueDirection(btn.dataset.dir);
                        }
                    };
                    btn.addEventListener('touchstart', handleDir, { passive: false });
                    btn.addEventListener('mousedown', handleDir);
                });

                // Botões de Fluxo do Jogo
                document.getElementById('startBtn').addEventListener('click', () => this.startGame());
                document.getElementById('restartBtn').addEventListener('click', () => this.startGame());
                document.getElementById('resumeBtn').addEventListener('click', () => this.togglePause());
                this.pauseBtn.addEventListener('click', () => this.togglePause());

                // Alternar Tema (Neon Moderno <-> Nokia 3310)
                this.themeToggleBtn.addEventListener('click', () => {
                    this.theme = this.theme === 'neon' ? 'nokia' : 'neon';
                    localStorage.setItem('snake_theme', this.theme);
                    this.applySavedPreferences();
                    this.resizeCanvas();
                });

                // Alternar Som
                this.soundToggleBtn.addEventListener('click', () => {
                    this.sound.toggleMute();
                    this.updateSoundIcons();
                });

                // Alterar Modo de Arena
                this.arenaModeSelect.addEventListener('change', (e) => {
                    this.arenaMode = e.target.value;
                    localStorage.setItem('snake_arena', this.arenaMode);
                    e.target.blur(); // Remove foco para não interferir nas teclas
                });

                // Alterar Velocidade
                this.speedSelect.addEventListener('change', (e) => {
                    this.speedMode = e.target.value;
                    localStorage.setItem('snake_speed', this.speedMode);
                    const cfg = SPEED_CONFIG[this.speedMode];
                    this.currentTickInterval = cfg.baseInterval;
                    e.target.blur();
                });

                // Mostrar/Ocultar D-Pad
                this.toggleDpadBtn.addEventListener('click', () => {
                    const isHidden = this.dpadContainer.classList.toggle('hidden');
                    localStorage.setItem('snake_dpad', isHidden ? 'hidden' : 'visible');
                    this.resizeCanvas();
                });
            }
        }

        // Inicializa o jogo após o carregamento completo da janela
        window.addEventListener('load', () => {
            window.snakeGame = new SnakeGame();
        });
    </script>
</body>
</html>
